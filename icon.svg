<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="110" fill="#0a0a0a"/>
  <!-- ★★북마크·파비콘은 **이 SVG** 를 쓴다 (대표 8-14: "북마크 아이콘은 그대론데").
       PNG(icon-192/512) 만 줄였더니 홈화면·북마크가 안 바뀌었다 —
       브라우저는 rel="icon" type="image/svg+xml" 을 PNG 보다 우선한다.
       → PNG 와 **같은 비율(캔버스의 70%)** 로 맞춘다.
       원래 마크의 실제 범위: x 60~452, y 29~438 (m 꼬리가 원 아래로 내려간다).
       가운데 (256, 233.5) 를 캔버스 중앙에 놓고 최대변 409 -> 358(=512*0.70) 로 줄인다.
       ★stroke-width 도 같이 줄어들어야 하므로 transform 으로 감싼다(수치 재계산 금지). -->
  <g transform="translate(256,256) scale(0.875) translate(-256,-233.5)">
    <!-- White circle -->
    <circle cx="256" cy="225" r="196" fill="white"/>
    <!-- Dark m lettermark: 3 arches as thick stroked paths, rounded caps -->
    <path fill="none" stroke="#0a0a0a" stroke-width="76" stroke-linecap="round" stroke-linejoin="round"
      d="M 108,372 L 108,196 C 108,108 202,108 202,196 L 202,372
         M 202,196 C 202,108 296,108 296,196 L 296,372
         M 296,196 C 296,108 390,108 390,196 L 390,400"/>
  </g>
</svg>
