<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>MURPY 한정 캐릭터 '돼쫀토' (세로 · 카톡 공유용)</title>
<!--
  한정 캐릭터 '돼쫀토' 코드 해금 안내. 540×960 CSS → 2배 캡처 = 1080×1920.
  Desktop\머피브랜딩\홍보이미지\8_근방단한정.png (헬토리 편)을 참고해 같은 계열로 맞췄다.

  캡처:
    chrome --headless=new --screenshot=promo_ddungddung_tall.png
           --window-size=540,960 --force-device-scale-factor=2 promo_ddungddung_tall.html
    ★--user-data-dir 를 따로 주지 않으면 실패한다.
    ★저장소 폴더로 바로 캡처하면 권한 거부 → 스크래치패드에 뽑아 복사할 것.

  ★한 장에 메시지 하나만 담는다(대표 지시). 돼쫀토 말고 다른 소식을 끼워 넣지 말 것.
  ★픽셀 폰트(Galmuri)에 font-weight:700 금지 — 가짜 볼드가 획을 뭉갠다.
  ★이모지 금지 — 라인 SVG / 픽셀 도형만.
  ★캐릭터는 스프라이트 시트의 정면 대기 프레임(0행 0열)을 배경위치로 잘라 쓴다.
    셀 145×224 를 **정수배**로만 키운다(비정수 배율 금지 — 도트가 뭉갠다).
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:540px; height:960px; overflow:hidden; }
  body {
    font-family:'Pretendard Variable',sans-serif; color:#fff;
    background:#05070c;
    display:flex; flex-direction:column; align-items:center;
    padding:34px 26px 22px; position:relative;
  }

  /* ── 배경: 파란 빛무리 + 퍼져나가는 호(弧) ── */
  .bg { position:absolute; inset:0; overflow:hidden; z-index:0; }
  .bg::after {                       /* 가운데서 번지는 빛 */
    content:''; position:absolute; left:50%; top:46%; width:900px; height:900px;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(61,126,255,.20), rgba(61,126,255,.05) 42%, transparent 66%);
  }
  .arc {                             /* 얇은 타원 테두리 여러 겹 = 퍼지는 파동 */
    position:absolute; left:50%; top:50%; border-radius:50%;
    border:1.5px solid rgba(61,126,255,.30);
    transform:translate(-50%,-50%); filter:blur(1.5px);
  }
  .a1 { width:640px;  height:1180px; }
  .a2 { width:900px;  height:1500px; border-color:rgba(61,126,255,.20); }
  .a3 { width:1180px; height:1820px; border-color:rgba(61,126,255,.12); }

  .wrap { position:relative; z-index:1; display:flex; flex-direction:column;
          align-items:center; width:100%; height:100%; }

  /* ── 머리말 ── */
  .eyebrow { font-size:12px; font-weight:800; letter-spacing:1px; color:#3D7EFF; }
  h1 { font-size:44px; font-weight:800; letter-spacing:-1.6px; line-height:1.14;
       text-align:center; margin-top:10px; }
  h1 .blue { color:#3D7EFF; }
  .sub { font-size:13.5px; color:#8a93a8; letter-spacing:-.3px; margin-top:12px; text-align:center; }

  /* ── 폰 목업 ── */
  .phone {
    width:342px; flex:1; margin-top:20px; border-radius:30px;
    border:2px solid rgba(61,126,255,.55); background:#000;
    box-shadow:0 0 44px rgba(61,126,255,.42), inset 0 0 26px rgba(61,126,255,.10);
    display:flex; flex-direction:column; align-items:center;
    padding:26px 18px 22px;
  }

  /* 캐릭터 = 시트 0행 0열(정면 대기). 셀 145×224 를 1배로 (2배 캡처라 실제 2배 확대) */
  .char {
    width:145px; height:224px; margin:auto 0 0;
    background-image:url('../../char/ddungddung.png');
    background-repeat:no-repeat;
    background-size:435px 896px;      /* 145*3 × 224*4 = 원본 그대로 */
    background-position:0 0;
    image-rendering:pixelated;
    filter:drop-shadow(0 12px 22px rgba(61,126,255,.34));
  }

  /* ── 잠금해제 카드 (앱의 코드 모달과 같은 얼굴) ── */
  .card {
    width:100%; margin:auto 0 0; text-align:center;
    background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.10);
    padding:18px 16px 16px;
  }
  .lock { display:flex; justify-content:center; margin-bottom:12px; }
  .lock i {
    position:relative; width:38px; height:34px; background:#F5C24B;
    box-shadow:0 0 0 3px #05070c; display:inline-block; font-style:normal;
  }
  .lock i::before {
    content:''; position:absolute; left:10px; top:-11px; width:14px; height:14px;
    border:3px solid #F5C24B; border-bottom:none; border-radius:8px 8px 0 0;
  }
  .lock i::after {
    content:''; position:absolute; left:15px; top:11px; width:6px; height:9px; background:#3a2a00;
  }
  .card h2 { font-family:'Galmuri14',sans-serif; font-size:16px; color:#fff; margin-bottom:9px; }
  .card p { font-size:12px; color:#8a93a8; line-height:1.7; }
  .code {
    margin-top:14px; padding:13px; border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.02);
    font-family:'Galmuri14',sans-serif; font-size:20px; color:#fff; letter-spacing:4px;
  }
  .btn {
    margin-top:11px; padding:12px; background:#F5C24B; color:#3a2a00;
    font-family:'Galmuri14',sans-serif; font-size:14px;
    box-shadow:0 4px 0 #b98d24;
  }

  /* ── 꼬리말 ── */
  .foot { margin-top:16px; display:flex; align-items:center; width:100%; }
  .foot .url { font-family:'Galmuri14',sans-serif; font-size:18px; color:#fff; }
  .foot .url i { font-style:normal; color:#3D7EFF; }
  .foot .cta { margin-left:auto; font-size:10.5px; color:#8a93a8; line-height:1.5; text-align:right; }
</style>
</head>
<body>

  <div class="bg">
    <div class="arc a1"></div>
    <div class="arc a2"></div>
    <div class="arc a3"></div>
  </div>

  <div class="wrap">
    <div class="eyebrow">한정 캐릭터</div>
    <h1>개발자가 그냥<br><span class="blue">만든 캐릭터</span></h1>
    <div class="sub">개발자가 눈 찢어진 토끼상을 좋아함.</div>

    <div class="phone">
      <div class="char"></div>
      <div class="card">
        <div class="lock"><i></i></div>
        <h2>돼쫀토 잠금해제</h2>
        <p>아래 <b style="color:#F5C24B">코드</b>를 입력하면<br>한정판 캐릭터가 열려요</p>
        <div class="code">DDUNGDDUNG</div>
        <div class="btn">잠금해제</div>
      </div>
    </div>

    <div class="foot">
      <div class="url">murpy<i>.app</i></div>
      <div class="cta">머피월드 → 캐릭터 → 자물쇠<br>코드 넣으면 바로 열려요</div>
    </div>
  </div>

</body>
</html>
