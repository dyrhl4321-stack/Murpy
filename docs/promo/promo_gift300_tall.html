<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>MURPY 베타테스터 300머피 지급 안내 (세로 · 카톡 공유용)</title>
<!--
  "베타테스터 전원 300머피 지급" 한 장짜리 공지. 540×960 CSS → 2배 캡처 = 1080×1920.
  캡처:
    chrome --headless=new --screenshot=promo_gift300_tall.png --window-size=540,960 --force-device-scale-factor=2 promo_gift300_tall.html

  ★한 장에 메시지 하나만 담는다(대표 지시). 300머피 말고 다른 소식을 끼워 넣지 말 것.
  ★픽셀 폰트(Galmuri)에 font-weight:700 금지 — 가짜 볼드가 획을 뭉갠다.
  ★이모지 금지 — 머피 코인 PNG + 라인 SVG 만 쓴다.
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:540px; height:960px; overflow:hidden; }
  body {
    font-family:'Pretendard Variable',sans-serif; color:#fff;
    background:
      radial-gradient(circle at 50% 30%, rgba(245,194,75,.13), transparent 58%),
      radial-gradient(rgba(122,164,255,0.06) 1px, transparent 1px) 0 0/10px 10px,
      #0a0d14;
    display:flex; flex-direction:column; padding:26px 26px 20px;
  }

  .top { display:flex; align-items:center; gap:9px; }
  .top img { height:30px; width:auto; }
  .badge {
    margin-left:auto; font-family:'Galmuri11',sans-serif; font-size:10px; letter-spacing:1px;
    color:#F5C24B; border:1px solid rgba(245,194,75,.45); background:rgba(245,194,75,.1);
    padding:5px 9px; border-radius:4px;
  }

  /* 헤더와 푸터 사이 남는 공간을 본문이 가운데로 나눠 갖는다(아래로 몰리는 것 방지) */
  .mid { margin:auto 0; }

  /* ── 주인공: 코인 + 숫자 ── */
  .hero { text-align:center; }
  .coin { width:146px; height:146px; image-rendering:pixelated;
          filter:drop-shadow(0 10px 26px rgba(245,194,75,.4)); }
  .eyebrow {
    font-family:'Galmuri11',sans-serif; font-size:11px; letter-spacing:3px;
    color:#F5C24B; margin:20px 0 12px;
  }
  .amount { display:flex; align-items:baseline; justify-content:center; gap:8px; }
  .amount .num {
    font-family:'Galmuri14',sans-serif; font-size:82px; line-height:1;
    color:#F5C24B; letter-spacing:2px;
  }
  .amount .unit { font-size:27px; font-weight:800; letter-spacing:-1px; color:#fff; }
  .lead { font-size:16px; font-weight:700; letter-spacing:-.5px; line-height:1.55; margin-top:16px; }
  .lead b { color:#F5C24B; font-weight:800; }
  .lead2 { font-size:12.5px; color:#8a93a8; line-height:1.6; margin-top:8px; }

  /* ── 받는 방법 2가지 ── */
  .how { display:flex; flex-direction:column; gap:9px; margin-top:30px; }
  .row {
    display:flex; gap:12px; align-items:center;
    background:linear-gradient(100deg,rgba(245,194,75,.10),rgba(245,194,75,.02));
    border:1px solid rgba(245,194,75,.28); border-radius:14px; padding:14px 15px;
  }
  .row.blue { background:linear-gradient(100deg,rgba(61,126,255,.10),rgba(61,126,255,.02));
              border-color:rgba(61,126,255,.28); }
  .row .ic { width:34px; height:34px; flex-shrink:0; border-radius:10px;
             background:rgba(245,194,75,.14); display:flex; align-items:center; justify-content:center; }
  .row.blue .ic { background:rgba(61,126,255,.16); }
  .row h3 { font-size:14.5px; font-weight:800; letter-spacing:-.4px; margin-bottom:3px; }
  .row p { font-size:11.5px; color:#9aa3b5; line-height:1.5; }
  .row p b { color:#cfd6e6; font-weight:700; }

  /* ── 쓰는 곳 ── */
  .use { margin-top:14px; border:1px solid rgba(255,255,255,.09); border-radius:14px; padding:13px 15px; }
  .use .t { font-size:11px; color:#8a93a8; margin-bottom:9px; }
  .use .t b { color:#fff; font-weight:700; }
  .use .cols { display:flex; gap:8px; }
  .use .c { flex:1; text-align:center; background:rgba(255,255,255,.04);
            border:1px solid rgba(255,255,255,.07); border-radius:10px; padding:9px 6px; }
  .use .c strong { display:block; font-size:12px; font-weight:800; margin-bottom:3px; }
  .use .c span { font-size:9.5px; color:#8a93a8; }
  .use .c span i { font-style:normal; color:#F5C24B; }

  .foot { margin-top:auto; display:flex; align-items:flex-end; }
  .foot .url { font-family:'Galmuri14',sans-serif; font-size:19px; color:#fff; }
  .foot .url i { font-style:normal; color:#3D7EFF; }
  .foot .cta { margin-left:auto; text-align:right; font-size:10px; color:#8a93a8; line-height:1.5; }
</style>
</head>
<body>

  <div class="top">
    <img src="../../logo-nukki.png" alt="MURPY">
    <div class="badge">CLOSED BETA</div>
  </div>

  <div class="mid">
  <div class="hero">
    <img class="coin" src="../../char/coin.png" alt="머피">
    <div class="eyebrow">BETA TESTER GIFT</div>
    <div class="amount">
      <span class="num">300</span><span class="unit">머피</span>
    </div>
    <div class="lead">베타테스터 전원에게 <b>300머피</b>를 드렸습니다</div>
    <div class="lead2">약속드린 대로 넣어드렸어요. 따로 신청하실 것 없습니다.</div>
  </div>

  <div class="how">
    <div class="row">
      <div class="ic">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#F5C24B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <div>
        <h3>이미 쓰고 계신 분</h3>
        <p>앱을 <b>켜기만</b> 하면 바로 들어와 있어요. 잔액이 <b>300</b>으로 올라갑니다.</p>
      </div>
    </div>
    <div class="row blue">
      <div class="ic">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#3D7EFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="3"/><circle cx="12" cy="12.5" r="3.6"/><path d="M8 5l1.4-2h5.2L16 5"/></svg>
      </div>
      <div>
        <h3>이제 시작하시는 분</h3>
        <p>가입하고 <b>첫 인증사진 한 장</b>만 올리면 바로 지급돼요.</p>
      </div>
    </div>
  </div>

  <div class="use">
    <div class="t"><b>머피</b>는 캐릭터와 내 방을 꾸미는 데 씁니다. 현금 결제 없습니다.</div>
    <div class="cols">
      <div class="c"><strong>캐릭터 옷</strong><span><i>15머피</i>부터</span></div>
      <div class="c"><strong>방 가구</strong><span><i>10~20머피</i></span></div>
      <div class="c"><strong>헤어</strong><span><i>15머피</i>부터</span></div>
    </div>
  </div>
  </div>

  <div class="foot">
    <div class="url">murpy<i>.app</i></div>
    <div class="cta">링크 접속 → 카카오 로그인<br>홈 화면에 추가하면 앱처럼</div>
  </div>

</body>
</html>
