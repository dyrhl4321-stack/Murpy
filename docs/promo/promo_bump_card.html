<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>머피 범프 — 스쿼드 광고 카드</title>
<!--
  스쿼드 히어로 광고 카드용 '머피 범프' 그림. 540x270 CSS → 2배 캡처 = 1080x540 (2:1).

  ★AI 프롬프트로 못 만든다. 우리 캐릭터 스프라이트와 범프 연출이 들어가야 하는데
    생성 AI 는 우리 도트 캐릭터를 그리지 못한다. 그래서 실제 에셋으로 직접 조립한다.

  캡처:
    chrome --headless=new --screenshot=promo_bump_card.png
           --window-size=540,270 --force-device-scale-factor=2 promo_bump_card.html
    ★--user-data-dir 를 따로 주지 않으면 실패한다.
    ★저장소 폴더로 바로 캡처하면 권한 거부 → 스크래치패드에 뽑아 복사할 것.

  ★범프 색 규칙(대표 확정): 개시자=골드 / 참여자=파랑. **캐릭터 본체는 칠하지 않는다** —
    빛은 맞닿는 이음새와 테두리에만.
  ★카드 왼쪽 절반에는 앱이 제목·부제를 얹는다 → 이쪽은 비워 둔다.
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:540px; height:270px; overflow:hidden; }
  body {
    background:#05070c; position:relative;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  /* 바닥 빛무리 */
  .glow { position:absolute; left:64%; top:50%; width:520px; height:320px;
          transform:translate(-50%,-50%);
          background:radial-gradient(ellipse, rgba(245,194,75,.22), rgba(61,126,255,.10) 45%, transparent 70%); }

  /* 두 대의 폰 — 오른쪽 절반에 몰아둔다(왼쪽은 앱 글씨 자리) */
  .stage { position:absolute; right:16px; top:50%; transform:translateY(-50%);
           display:flex; align-items:center; }
  .phone { width:132px; height:216px; border-radius:16px; background:#0a0d14;
           box-shadow:0 0 0 3px #1b2233, 0 14px 34px rgba(0,0,0,.6);
           position:relative; overflow:hidden; }
  .phone.l { transform:rotate(-3deg); }
  .phone.r { transform:rotate(3deg); }
  .scr { position:absolute; inset:5px; border-radius:12px; background:#080b12; overflow:hidden; }

  /* 맞닿는 이음새 = 범프 빛기둥 */
  .seam { width:16px; height:186px; position:relative; z-index:3; margin:0 -6px;
          background:linear-gradient(90deg, rgba(61,126,255,0) 0%, rgba(61,126,255,.55) 22%,
                     #F5C24B 50%, rgba(245,194,75,.55) 78%, rgba(245,194,75,0) 100%);
          filter:blur(.4px); }
  .seam::after { content:''; position:absolute; left:50%; top:-10px; bottom:-10px; width:3px;
                 transform:translateX(-50%); background:#fff8e2; filter:blur(1.5px); }

  /* 화면 안 캐릭터 — 정면 정지(row0/col0). 정수배 픽셀 유지 */
  .ch { position:absolute; bottom:34px; width:70px; height:112px;
        background-image:url('../../char/walk.png');
        background-repeat:no-repeat; background-size:210px 448px; background-position:0 0;
        image-rendering:pixelated; }
  .ch.a { right:6px; }            /* 왼쪽 폰: 이음새 쪽으로 붙는다 */
  .ch.b { left:6px; }             /* 오른쪽 폰: 이음새 쪽으로 붙는다 */

  /* 화면 하단 바닥선 */
  .floor { position:absolute; left:0; right:0; bottom:26px; height:2px; background:rgba(255,255,255,.07); }
  /* 화면 위쪽 라벨(작게) */
  .lab { position:absolute; top:10px; left:0; right:0; text-align:center;
         font-size:7px; letter-spacing:.5px; }
  .lab.g { color:#F5C24B; }
  .lab.b { color:#7aa8ff; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="stage">
    <div class="phone l">
      <div class="scr">
        <div class="lab g">MURPY BUMP</div>
        <div class="floor"></div>
        <div class="ch a"></div>
      </div>
    </div>
    <div class="seam"></div>
    <div class="phone r">
      <div class="scr">
        <div class="lab b">MURPY BUMP</div>
        <div class="floor"></div>
        <div class="ch b"></div>
      </div>
    </div>
  </div>
</body>
</html>
