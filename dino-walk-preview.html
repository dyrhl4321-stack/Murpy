<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>공룡 걷기 미리보기 — 머피월드</title>
<style>
  :root{
    --bg:#14161c; --panel:#1c1f27; --line:#2c3140; --fg:#e8ecf4; --dim:#8a93a6; --blue:#4a7dff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
       -webkit-text-size-adjust:100%}
  .wrap{max-width:520px;margin:0 auto;padding:14px 14px 40px}
  h1{font-size:17px;margin:4px 0 2px;letter-spacing:-.3px}
  .sub{font-size:12px;color:var(--dim);line-height:1.55;margin:0 0 14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
        padding:12px;margin-bottom:12px}
  .card h2{font-size:13px;margin:0 0 3px;font-weight:700}
  .card .why{font-size:11px;color:var(--dim);line-height:1.5;margin:0 0 10px}

  .strip{display:flex;gap:4px;align-items:flex-end;overflow-x:auto;padding-bottom:4px}
  .slot{flex:0 0 auto;text-align:center}
  .slot span{display:block;font-size:10px;color:var(--dim);margin-top:4px}
  .spr{image-rendering:pixelated;background-repeat:no-repeat}

  /* 걷기 3프레임 / 대기 8프레임 — to 를 -N칸으로 두고 steps(N). -(N-1)칸이면 프레임이 밀린다. */
  .walk{animation:w3 .5s steps(3) infinite}
  .idle{animation:w8 .96s steps(8) infinite}
  @keyframes w3{from{background-position-x:var(--x0)}
                to{background-position-x:calc(var(--x0) - var(--fw) * 3)}}
  @keyframes w8{from{background-position-x:var(--x0)}
                to{background-position-x:calc(var(--x0) - var(--fw) * 8)}}

  .seg{display:flex;gap:6px;margin-top:4px}
  .seg button{flex:1;padding:9px 4px;border-radius:8px;background:none;
              border:1px solid var(--line);color:var(--dim);font-size:12px;
              font-weight:600;font-family:inherit;cursor:pointer}
  .seg button.on{border-color:var(--blue);color:var(--blue)}

  #room{position:relative;width:100%;aspect-ratio:1/1;background:#20242e;
        border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:10px}
  #room .spr{position:absolute;left:0;top:0;will-change:transform}
  .note{font-size:11px;color:var(--dim);line-height:1.55;margin-top:10px}
  .note b{color:var(--fg)}
</style>
</head>
<body>
<div class="wrap">
  <h1>공룡 걷기 미리보기</h1>
  <p class="sub">측면(옆걸음)만 몸이 5~9% 길게 그려져 있어서 보정이 필요합니다.
     세 가지 중 어느 것이 자연스러운지 <b>움직이는 상태로</b> 봐주세요.
     대기 자세(둥가둥가)는 지금 앱에 있는 그대로입니다.</p>

  <div id="cards"></div>

  <div class="card">
    <h2>실제 크기로 방을 걸어다니기</h2>
    <p class="why">위에서 고른 후보로, 방에 놓였을 때의 실제 크기(타일 기준)로 걷습니다.
       확대해서 보면 다 괜찮아 보이므로 <b>이 크기에서 판단하는 게 맞습니다.</b></p>
    <div class="seg" id="pick"></div>
    <div id="room"></div>
    <p class="note">공룡이 방향을 바꿀 때 <b>몸이 커졌다 작아졌다 하는지</b>를 봐주세요.
       그게 이 화면에서 확인할 유일한 것입니다.</p>
  </div>
</div>

<script>
// ===== 공룡 걷기 미리보기 =====
// 세 시트는 char/build_dino_walk.py --variants 산출물이다.
// 행 = 대기 · 앞 · 좌 · 뒤 · 우 (산 펫 팩과 같은 순서), 열 = 프레임.
var VARIANTS = [
  { id:'height', name:'키 맞춤 (추천)', cw:114, ch:107,
    why:'정면과 키를 같게 맞춥니다. 옆을 볼 때 머리가 5px 작아지지만 이 크기에서는 안 보입니다.' },
  { id:'mid', name:'절충', cw:114, ch:111,
    why:'키와 머리 오차를 반씩 나눕니다.' },
  { id:'head', name:'머리 맞춤', cw:114, ch:115,
    why:'머리 크기를 같게 맞춥니다. 대신 옆을 보면 몸이 9px 커집니다 — 가구 옆에서 티가 납니다.' }
];
var ROWS = ['대기', '앞', '좌', '뒤', '우'];
var COLS = 8;
var state = { pick: 'height' };

function src(v) { return 'char/rooms/s2608_dino_pet_' + v.id + '.png?v=1'; }

// 스프라이트 한 칸을 만든다. k = 확대 배율, row = 행, frames = 그 행의 프레임 수
function sprite(v, row, frames, k) {
  var w = Math.round(v.cw * k), h = Math.round(v.ch * k);
  var d = document.createElement('div');
  d.className = 'spr ' + (row === 0 ? 'idle' : 'walk');
  d.style.width = w + 'px';
  d.style.height = h + 'px';
  d.style.backgroundImage = 'url(' + src(v) + ')';
  d.style.backgroundSize = (w * COLS) + 'px ' + (h * ROWS.length) + 'px';
  d.style.backgroundPositionY = (-row * h) + 'px';
  d.style.setProperty('--fw', w + 'px');
  d.style.setProperty('--x0', '0px');
  return d;
}

// ---- 후보 카드 (확대해서 자세히) ----
var host = document.getElementById('cards');
VARIANTS.forEach(function (v) {
  var c = document.createElement('div');
  c.className = 'card';
  c.innerHTML = '<h2>' + v.name + '</h2><p class="why">' + v.why + '</p>';
  var strip = document.createElement('div');
  strip.className = 'strip';
  ROWS.forEach(function (label, ri) {
    var slot = document.createElement('div');
    slot.className = 'slot';
    slot.appendChild(sprite(v, ri, ri === 0 ? 8 : 3, 0.9));
    var s = document.createElement('span'); s.textContent = label;
    slot.appendChild(s);
    strip.appendChild(slot);
  });
  c.appendChild(strip);
  host.appendChild(c);
});

// ---- 실제 크기로 걷기 ----
// 앱의 방은 768 좌표계이고 공룡 셀은 114 폭이다. 화면 폭에 맞춰 같은 비율로 줄인다.
var room = document.getElementById('room');
var walker = null, wtimer = null;

function buildRoom() {
  room.innerHTML = '';
  if (wtimer) { clearInterval(wtimer); wtimer = null; }
  var v = VARIANTS.filter(function (x) { return x.id === state.pick; })[0];
  var k = room.clientWidth / 768;                 // 방 좌표계 -> 화면
  var el = sprite(v, 1, 3, k);
  el.style.transition = 'transform 1.1s linear';
  room.appendChild(el);
  var W = room.clientWidth, H = room.clientHeight;
  var pos = { x: W * 0.2, y: H * 0.5 };
  el.style.transform = 'translate3d(' + pos.x + 'px,' + pos.y + 'px,0)';
  walker = { el: el, v: v, k: k, pos: pos, W: W, H: H };

  // 방향을 돌아가며 바꾼다 — 방향이 바뀔 때 몸 크기가 튀는지 보는 게 목적이다.
  var seq = [
    { row: 4, dx:  1, dy:  0 },   // 우
    { row: 1, dx:  0, dy:  1 },   // 앞(아래로)
    { row: 2, dx: -1, dy:  0 },   // 좌
    { row: 3, dx:  0, dy: -1 }    // 뒤(위로)
  ];
  var i = 0;
  function step() {
    var s = seq[i % seq.length]; i++;
    var w = walker.el, hgt = Math.round(walker.v.ch * walker.k);
    w.style.backgroundPositionY = (-s.row * hgt) + 'px';
    walker.pos.x = Math.max(0, Math.min(walker.W - Math.round(walker.v.cw * walker.k),
                   walker.pos.x + s.dx * walker.W * 0.28));
    walker.pos.y = Math.max(0, Math.min(walker.H - hgt,
                   walker.pos.y + s.dy * walker.H * 0.22));
    w.style.transform = 'translate3d(' + Math.round(walker.pos.x) + 'px,' +
                        Math.round(walker.pos.y) + 'px,0)';
  }
  step();
  wtimer = setInterval(step, 1400);
}

var pickHost = document.getElementById('pick');
function drawPick() {
  pickHost.innerHTML = '';
  VARIANTS.forEach(function (v) {
    var b = document.createElement('button');
    b.textContent = v.name.replace(' (추천)', '');
    b.className = (state.pick === v.id) ? 'on' : '';
    b.onclick = function () { state.pick = v.id; drawPick(); buildRoom(); };
    pickHost.appendChild(b);
  });
}
drawPick();
buildRoom();
addEventListener('resize', buildRoom);
</script>
</body>
</html>
