<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">
<title>머피 새로 받기</title>
<style>
  body{margin:0;background:#14161c;color:#e8ecf4;
       font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
       display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  .box{max-width:420px;width:100%;text-align:center}
  h1{font-size:19px;margin:0 0 8px}
  p{font-size:13px;color:#8a93a6;line-height:1.6;margin:0 0 20px}
  #log{text-align:left;background:#1c1f27;border:1px solid #2c3140;border-radius:10px;
       padding:12px;font-size:12px;line-height:1.7;color:#8a93a6;min-height:120px;
       white-space:pre-wrap;word-break:break-all}
  #log b{color:#3ecf8e}
  .go{display:block;width:100%;margin-top:14px;padding:14px;border-radius:10px;
      border:1px solid #4a7dff;background:none;color:#4a7dff;font-size:15px;
      font-weight:700;font-family:inherit;cursor:pointer;text-decoration:none}
</style>
</head>
<body>
<div class="box">
  <h1>머피 새로 받기</h1>
  <p>폰에 남아 있는 예전 화면을 지우고 최신 버전을 받아옵니다.<br>
     로그인은 유지됩니다 — 지우는 건 화면 파일뿐이에요.</p>
  <div id="log">준비 중…</div>
  <a class="go" id="go" href="/">앱으로 돌아가기</a>
</div>
<script>
// ===== 캐시 강제 초기화 =====
// ★왜 필요한가 (2026-08-25) — 서비스워커에 skipWaiting 이 있는데도 대표 폰에서 옛 화면이
//   계속 떴다. 브라우저가 새 sw.js 를 아직 안 받아오면 예전 워커가 그대로 응답하기 때문이다.
//   이 페이지는 **새 파일이라 캐시에 없다** → 무조건 네트워크로 받아진다. 그래서 통한다.
// ★지우는 것은 캐시와 서비스워커뿐이다. localStorage 는 **안 건드린다** —
//   로그인 상태·방 복귀 정보(mw_room_in)·오늘 덱이 거기 있어서 지우면 사용자가 튕긴다.
var log = document.getElementById('log');
var lines = [];
function say(t, ok) {
  lines.push(ok ? '<b>' + t + '</b>' : t);
  log.innerHTML = lines.join('\n');
}

(async function () {
  lines = [];
  try {
    if ('serviceWorker' in navigator) {
      var regs = await navigator.serviceWorker.getRegistrations();
      say('서비스워커 ' + regs.length + '개 발견');
      for (var i = 0; i < regs.length; i++) {
        await regs[i].unregister();
      }
      say('서비스워커 해제 완료', true);
    } else {
      say('서비스워커 미지원 브라우저 (건너뜀)');
    }
  } catch (e) { say('서비스워커 해제 실패: ' + e.message); }

  try {
    if (window.caches) {
      var keys = await caches.keys();
      say('캐시 ' + keys.length + '개: ' + keys.join(', '));
      for (var k = 0; k < keys.length; k++) await caches.delete(keys[k]);
      say('캐시 삭제 완료', true);
    }
  } catch (e) { say('캐시 삭제 실패: ' + e.message); }

  say('');
  say('다 됐어요. 아래 버튼을 누르세요.', true);
  // 캐시가 지워진 상태로 다시 들어가게 시각을 붙인다(중간 프록시까지 우회)
  document.getElementById('go').href = '/?fresh=' + Date.now();
})();
</script>
</body>
</html>
