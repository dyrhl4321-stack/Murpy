<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--
  근손실방지단 크루 초대 랜딩 (10-19). 짧은 주소 = https://murpy.app/c-gbd.html
  [초대 주소는 여기 한 곳] INVITE 상수. 초대 코드를 새로 만들면(관리자 크루 관리 '링크') 이 값만 바꾼다.
  ★주소는 반드시 .html 로 끝나야 한다(폴더형 주소는 예전 서비스워커가 앱 본체로 돌려줬다).
  ★미리보기 그림을 바꾸면 파일 이름도 바꿀 것(og-crew-gbd-v2.png …) — 카톡이 그림을 주소 기준으로 오래 캐시한다.
  흐름(대표 10-19)
    카톡 안: 열자마자 카톡 밖으로 — 아이폰 kakaotalk://web/openExternal(사파리 → 앱이 있으면 앱, 없으면 앱스토어),
             안드로이드 intent://(앱, 없으면 플레이스토어). 자동이 막히면 아래 버튼이 그대로 보인다.
    사파리·크롬: '머피 앱으로 열기'(안드로이드) 또는 'App Store에서 받기'(아이폰) + '웹에서 바로 가입'.
    앱·스토어 버튼을 누르면 초대 주소를 클립보드에 넣어 둔다 → 설치 뒤 앱 스쿼드 탭 '초대 링크 붙여넣기'로 이어받는다.
-->
<title>근손실방지단 크루 초대 · Murpy</title>
<meta name="description" content="머피 크루 초대장이 도착했어요. 근손실방지단에 함께해요.">
<meta name="theme-color" content="#0b0f1a">
<meta name="color-scheme" content="dark">
<meta name="apple-itunes-app" content="app-id=6809371046, app-argument=https://murpy.app/?crew=FSuECLq2EanaXSrBQxdz&amp;k=r638a3r47z">
<meta property="og:type" content="website">
<meta property="og:title" content="근손실방지단 크루 초대">
<meta property="og:description" content="머피 크루 초대장이 도착했어요">
<meta property="og:image" content="https://murpy.app/og-crew-gbd-v1.png">
<meta property="og:image:width" content="800">
<meta property="og:image:height" content="400">
<meta property="og:url" content="https://murpy.app/c-gbd.html">
<link rel="icon" href="/icon-192.png">
<script>
var INVITE = 'https://murpy.app/?crew=FSuECLq2EanaXSrBQxdz&k=r638a3r47z';
var STORE_IOS = 'https://apps.apple.com/kr/app/id6809371046';
var STORE_PLAY = 'https://play.google.com/store/apps/details?id=app.murpy.twa';
var UA = navigator.userAgent || '', IOS = /iPhone|iPad|iPod/i.test(UA), AND = /Android/i.test(UA), KT = /KAKAOTALK/i.test(UA);
function intentUrl() { return 'intent://murpy.app/?' + INVITE.split('?')[1] + '#Intent;scheme=https;package=app.murpy.twa;S.browser_fallback_url=' + encodeURIComponent(STORE_PLAY) + ';end'; }
function ktOut() { return 'kakaotalk://web/openExternal?url=' + encodeURIComponent(INVITE + '&via=kt'); }
// 카톡 안이면 열자마자 밖으로(한 번만)
(function () { try {
  if (!KT || !(IOS || AND)) return;
  try { if (sessionStorage.getItem('murpy_kt_land')) return; sessionStorage.setItem('murpy_kt_land', '1'); } catch (e) {}
  location.href = IOS ? ktOut() : intentUrl();
} catch (e) {} })();
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:#0b0f1a}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#e8ecf4;background:#0b0f1a;
  -webkit-font-smoothing:antialiased;line-height:1.5;word-break:keep-all;min-height:100dvh;display:flex;flex-direction:column}
main{flex:1;width:100%;max-width:440px;margin:0 auto;padding:28px 20px 0}
.top{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.top img{width:28px;height:28px;border-radius:7px}
.say{margin-top:28px;font-size:17px;color:#aeb6c8}
.say b{color:#fff;font-weight:700}
.letter{position:relative;margin-top:18px;background:#efe4c8;color:#1a1510;border:3px solid #2a2117;box-shadow:0 0 0 3px #05070c,6px 6px 0 3px #05070c;padding:22px 20px 20px}
.letter .k{font-family:'GalmuriMono11',monospace;font-size:12px;letter-spacing:2.5px;color:#8a7a5c}
.letter h1{font-family:'Galmuri14',sans-serif;font-weight:400;font-size:34px;line-height:1.15;margin-top:8px;letter-spacing:-.5px}
.letter .park{margin-top:16px;aspect-ratio:16/10;border:3px solid #2a2117;background:#6a8f4e url('/char/fields/field_park2.png?v=5') 50% 48%/300% auto no-repeat;image-rendering:pixelated}
.letter p{margin-top:14px;font-size:15px;color:#4a4033;padding-right:84px}
.seal{position:absolute;right:16px;bottom:14px;width:76px;height:76px;border-radius:50%;border:4px solid #E4472E;display:flex;align-items:center;justify-content:center;
  transform:rotate(-12deg);font-family:'Galmuri14',sans-serif;font-size:14px;color:#E4472E}
.seal:after{content:'';position:absolute;inset:4px;border-radius:50%;border:2px solid #E4472E}
.cta{position:sticky;bottom:0;width:100%;max-width:440px;margin:28px auto 0;padding:14px 20px calc(16px + env(safe-area-inset-bottom));background:#0b0f1a;display:grid;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;min-height:54px;background:#121827;border:2px solid #05070c;box-shadow:0 0 0 2px #232b40,0 3px 0 #05060a;
  color:#fff;font:inherit;font-weight:700;font-size:16px;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 2px #232b40,0 1px 0 #05060a}
.btn.main{border-color:#05070c;box-shadow:0 0 0 2px #3D7EFF,0 3px 0 #05060a}
.hint{font-size:13.5px;color:#aeb6c8;text-align:center;padding:2px 4px 0}
.web{display:block;text-align:center;padding:8px 0 2px;color:#8a93a8;font-size:14px;text-decoration:underline;text-underline-offset:3px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div class="top"><img src="/icon-192.png" alt="">Murpy</div>
  <div class="say"><b>근손실방지단</b>에서 초대했어요</div>
  <div class="letter">
    <div class="k">CREW INVITATION</div>
    <h1>근손실방지단</h1>
    <div class="park" role="img" aria-label="머피월드 공원"></div>
    <p>러닝 기록과 헬스장 출석이 크루 기록에 같이 쌓여요</p>
    <div class="seal">근손실</div>
  </div>
</main>
<div class="cta">
  <a class="btn main" id="b-app" href="#" hidden>머피 앱으로 열기</a>
  <a class="btn" id="b-ios" href="https://apps.apple.com/kr/app/id6809371046" hidden>App Store에서 받기</a>
  <a class="btn" id="b-play" href="https://play.google.com/store/apps/details?id=app.murpy.twa" hidden>Google Play에서 받기</a>
  <p class="hint" id="b-hint" hidden>앱이 이미 있으면 열고 스쿼드 탭에서 '초대 링크 붙여넣기'를 눌러 주세요</p>
  <a class="web" id="b-web" href="/?crew=FSuECLq2EanaXSrBQxdz&amp;k=r638a3r47z">웹에서 바로 가입</a>
</div>
<script>
function copyInvite() {
  try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(INVITE).catch(function () {}); return; } } catch (e) {}
  try { var t = document.createElement('textarea'); t.value = INVITE; t.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); } catch (e) {}
}
var bApp = document.getElementById('b-app'), bIos = document.getElementById('b-ios'), bPlay = document.getElementById('b-play');
// 아이폰 사파리는 같은 도메인 이동으로 앱을 못 연다 → 앱 버튼 대신 App Store(설치돼 있으면 거기서 '열기')
if (AND || (IOS && KT)) bApp.hidden = false;
if (IOS) bIos.hidden = false;
if (IOS && !KT) { bIos.textContent = 'App Store에서 열기'; document.getElementById('b-hint').hidden = false; }
if (AND) bPlay.hidden = false;
if (!IOS && !AND) { bIos.hidden = false; bPlay.hidden = false; }
bApp.addEventListener('click', function (e) { e.preventDefault(); copyInvite(); location.href = IOS ? ktOut() : intentUrl(); });
// 복사가 끝날 틈을 주고 스토어로
[bIos, bPlay].forEach(function (b) { b.addEventListener('click', function (e) { e.preventDefault(); copyInvite(); setTimeout(function () { location.href = b.href; }, 180); }); });
</script>
</body>
</html>
