<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0D12">
<meta name="robots" content="noindex,nofollow">
<title>살금</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
:root{
  --bg:#0B0D12; --surface:#141821; --raised:#1C212C;
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --t1:#fff; --t2:rgba(255,255,255,.64); --t3:rgba(255,255,255,.40);
  --accent:#7C9BFF; --soft:rgba(124,155,255,.42); --bad:#FF5A5F;
  --r:18px; --gap:12px; --pad:13px; --safe-b:max(20px,env(safe-area-inset-bottom));
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--t1);font-family:Pretendard,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;display:flex;justify-content:center}
#app{width:100%;max-width:430px;min-height:100dvh;padding:max(14px,env(safe-area-inset-top)) 16px var(--safe-b);display:flex;flex-direction:column;gap:var(--gap)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
.top{display:flex;align-items:center;justify-content:space-between;height:36px;flex:none}
.brand{font-size:20px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:7px}
.brand i{font-size:19px;color:var(--accent)}
.chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.chip{height:24px;padding:0 9px;border:1px solid var(--line2);border-radius:12px;font-size:10px;font-weight:800;color:var(--t2);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.chip i{font-size:12px}
.chip.on{border-color:var(--accent);color:var(--accent)}
.scene{position:relative;border:3px solid #05070c;border-radius:14px;background:#05070c;overflow:hidden;flex:none}
.scene canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.tag{position:absolute;left:10px;font-family:Galmuri11,sans-serif;font-size:11px;font-weight:700;height:24px;padding:0 8px;border:2px solid #05070c;background:#fff;color:#05070c;box-shadow:2px 2px 0 rgba(5,7,12,.55);display:flex;align-items:center;gap:5px;white-space:nowrap}
.tag.me{background:var(--accent)}
.bubble{position:absolute;font-family:Galmuri11,sans-serif;font-weight:700;font-size:13px;color:#05070c;background:#fff;border:2px solid #05070c;padding:4px 8px;box-shadow:2px 2px 0 rgba(5,7,12,.55);white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .15s}
.bubble.show{opacity:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);flex:none}
.h{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px;margin-bottom:10px}
.h i{font-size:16px;color:var(--accent)}
.h .r{margin-left:auto;font-size:11px;font-weight:500;color:var(--t3)}
.num{font-variant-numeric:tabular-nums}
.btn{height:52px;border-radius:18px;background:var(--raised);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:700;color:var(--t1);transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn i{font-size:18px;color:var(--accent)}
.btn.sq{width:52px;flex:none}
.row{display:flex;gap:var(--gap)}
.grow{flex:1}
.spacer{flex:1;min-height:0}
.c-bad{color:var(--bad)}.c-mid{color:var(--accent)}.c-ok{color:var(--soft)}
/* 처음 */
.hero h1{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.25}
.hero p{font-size:13px;font-weight:600;color:var(--t2);margin-top:6px;line-height:1.45}
.pick{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);padding:12px var(--pad);transition:transform .12s}
.pick:active{transform:scale(.98)}
.pick .pic{width:56px;height:56px;border:2px solid #05070c;background:#2a2f3d;image-rendering:pixelated;background-repeat:no-repeat}
.pick b{font-size:16px;font-weight:800;display:block}
.pick span{font-size:12px;font-weight:500;color:var(--t2);display:block;margin-top:3px;line-height:1.35}
.pick i{font-size:18px;color:var(--accent)}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.err{font-size:12px;font-weight:600;color:var(--bad);line-height:1.45}
/* 윗집 */
.now{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.now .lbl{font-size:11px;font-weight:500;color:var(--t2);margin-bottom:6px}
.now .big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1;min-width:2.1em}
.now .why{font-size:15px;font-weight:700;line-height:1.35}
.meter{display:flex;gap:3px;margin-top:9px;height:8px}
.meter span{flex:1;border-radius:2px;background:var(--raised)}
.paws{display:flex;align-items:flex-end;gap:2px;height:54px;padding:0 2px;overflow:hidden}
.paws i{display:block;line-height:1;flex:none}
.paws i:nth-child(odd){transform:translateY(-9px) rotate(-14deg)}
.paws i:nth-child(even){transform:rotate(14deg)}
.paws .empty{font-size:12px;font-weight:500;color:var(--t3);align-self:center;font-style:normal}
.split{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;margin-top:12px;background:var(--raised)}
.split i{display:block;min-width:0;transition:flex-grow .3s}
.legend{display:flex;justify-content:space-between;margin-top:9px}
.legend div{font-size:11px;font-weight:500;color:var(--t2);display:flex;align-items:baseline;gap:5px}
.legend b{font-size:15px;font-weight:700;color:var(--t1)}
.legend s{width:8px;height:8px;border-radius:2px;display:inline-block;align-self:center}
.tip{display:flex;align-items:center;gap:10px;padding:11px var(--pad);border:1px solid var(--line);border-radius:var(--r);flex:none}
.tip i{font-size:20px;color:var(--accent)}
.tip p{font-size:13px;font-weight:600;line-height:1.35}
.badge{height:18px;padding:0 6px;border-radius:6px;border:1px solid currentColor;font-size:10px;font-weight:800;display:inline-flex;align-items:center;color:var(--accent);margin-left:auto;flex:none;white-space:nowrap}
/* 아랫집 */
.live{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}
.live .lbl{font-size:11px;font-weight:500;color:var(--t2);margin-bottom:6px}
.live .big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
.live .big small{font-size:15px;font-weight:700;margin-left:3px}
.live .side{text-align:right;font-size:12px;font-weight:600;color:var(--t2);line-height:1.5}
.live .side b{color:var(--t1);font-size:15px;font-weight:700}
.prog{height:6px;border-radius:3px;background:var(--raised);margin-top:12px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0}
.verdict .lbl{font-size:11px;font-weight:500;color:var(--t2);margin-bottom:6px}
.verdict .big{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.verdict p{font-size:13px;font-weight:600;line-height:1.4;color:var(--t2);margin-top:7px}
.verdict p b{color:var(--t1);font-weight:700}
.scale{margin-top:13px;position:relative}
.scale .bar{display:flex;gap:3px;height:10px}
.scale .bar i{display:block;border-radius:3px}
.scale .pin{position:absolute;top:-5px;width:4px;height:20px;border-radius:2px;background:#fff;box-shadow:0 0 0 3px var(--surface);transform:translateX(-50%)}
.scale .lab{display:flex;margin-top:7px;font-size:10px;font-weight:800;color:var(--t3)}
.tl{position:relative;height:64px;margin:4px 8px 0}
.tl .rail{position:absolute;left:-8px;right:-8px;bottom:8px;height:6px;background:repeating-linear-gradient(90deg,var(--line2) 0 6px,transparent 6px 12px)}
.tl i{position:absolute;bottom:18px;line-height:1;transform:translateX(-50%) rotate(-12deg)}
.tl i:nth-of-type(even){transform:translateX(-50%) rotate(12deg);bottom:24px}
.tl .win{position:absolute;top:-4px;bottom:0;border:2px solid #fff;border-bottom:none}
.tl .win em{position:absolute;top:-11px;left:8px;padding:0 6px;background:var(--surface);font-family:Galmuri11,sans-serif;font-style:normal;font-size:11px;font-weight:700;white-space:nowrap}
.ticks{display:flex;justify-content:space-between;font-size:10px;font-weight:500;color:var(--t3);margin-top:6px}
.sum{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.sum .pic{width:64px;height:64px;image-rendering:pixelated;background:url(img/cat.png) 0 0/128px 64px no-repeat}
.sum .n{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1}
.sum .n small{font-size:15px;font-weight:700;margin-left:2px}
.sum .d{font-size:13px;font-weight:600;color:var(--t2);margin-top:6px;line-height:1.4}
.sum .d b{color:var(--t1);font-weight:700}
.kv{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.kv span{height:28px;padding:0 9px;white-space:nowrap;border:1px solid var(--line2);border-radius:14px;font-size:11px;font-weight:500;color:var(--t2);display:inline-flex;align-items:center;gap:6px}
.kv b{font-size:12px;font-weight:700;color:var(--t1)}
.note{display:flex;gap:10px;align-items:flex-start;padding:11px var(--pad);border:1px solid var(--line);border-radius:var(--r);flex:none}
.note i{font-size:18px;color:var(--accent);margin-top:1px}
.note p{font-size:12px;font-weight:500;line-height:1.45;color:var(--t2)}
.note p b{color:var(--t1);font-weight:700;white-space:nowrap}

/* === 머피월드 실측 이식 (Murpy index.html .mw-wb-tabbtn / .mw-coincap / .mw-region) === */
.brand{font-family:Galmuri14,Galmuri11,sans-serif;font-size:22px;font-weight:700;letter-spacing:-3px;gap:0;text-shadow:2px 2px 0 #05070c}
.brand em{font-style:normal;color:var(--accent)}
.cap{display:inline-flex;align-items:center;gap:8px;background:#0b101d;border:2px solid #05070c;border-radius:999px;padding:5px 11px;box-shadow:inset 0 2px 4px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.06);font-family:Galmuri11,sans-serif;font-size:11px;color:#fff;white-space:nowrap}
.cap b{font-weight:700;color:var(--accent)}
.cap u{text-decoration:none;width:2px;height:10px;background:#2b3350}
.card{background:#141a28;border:2px solid #05070c;box-shadow:0 0 0 2px #2b3350;border-radius:16px}
.tip,.note{background:#101624;border:2px solid #05070c;box-shadow:0 0 0 2px #2b3350;border-radius:16px}
.btn{height:auto;padding:14px 8px;border-radius:0;background:#1b2233;border:3px solid #05070c;box-shadow:0 0 0 2px #2b3350,0 5px 0 #05060a;font-family:Galmuri11,sans-serif;font-size:14px;font-weight:700;margin-bottom:5px;transition:none}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 2px #2b3350,0 1px 0 #05060a}
.btn.sq{width:auto;padding:14px 14px;font-size:12px;color:var(--t2)}
.btn .sqi{width:10px;height:10px;background:var(--accent);box-shadow:0 0 0 2px #05070c}
.btn .tri{width:0;height:0;border-left:9px solid var(--accent);border-top:6px solid transparent;border-bottom:6px solid transparent}
.badge{height:20px;padding:0 6px;border-radius:0;border:2px solid #05070c;background:#0d111a;box-shadow:0 0 0 1px #2b3350;font-family:Galmuri11,sans-serif;font-size:10px;font-weight:700;color:var(--accent)}
.pick{border-radius:0;background:#1b2233;border:3px solid #05070c;box-shadow:0 0 0 2px #2b3350,0 5px 0 #05060a;margin-bottom:5px;transition:none}
.pick:active{transform:translateY(4px);box-shadow:0 0 0 2px #2b3350,0 1px 0 #05060a}
.pick .pic{box-shadow:0 0 0 2px #2b3350;background-color:#0d111a}
.pick b{font-family:Galmuri14,Galmuri11,sans-serif;font-size:16px;font-weight:700}
.pick .tri{width:0;height:0;border-left:10px solid var(--accent);border-top:7px solid transparent;border-bottom:7px solid transparent}
.hero .free{font-size:12px;font-weight:600;color:var(--t3);margin-top:8px}
.meter{gap:2px;height:12px;background:#0e1320;border:3px solid #05070c;box-shadow:inset 2px 2px 0 rgba(0,0,0,.4);padding:0}
.meter span{border-radius:0;background:transparent}
.split{border-radius:0;height:12px;background:#0e1320;border:3px solid #05070c;box-shadow:inset 2px 2px 0 rgba(0,0,0,.4);gap:0}
.legend s{border-radius:0;box-shadow:0 0 0 1px #05070c}
.prog{height:12px;border-radius:0;background:#0e1320;border:3px solid #05070c;box-shadow:inset 2px 2px 0 rgba(0,0,0,.4)}
.scale .bar{height:12px;gap:0;border:3px solid #05070c;background:#0e1320}
.scale .bar i{border-radius:0}
.scale .pin{border-radius:0;box-shadow:0 0 0 2px #05070c;top:-4px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat div{font-size:11px;font-weight:500;color:var(--t2)}
.stat b{display:block;font-size:17px;font-weight:800;color:var(--t1);margin-top:3px}

</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* 살금 시험판 0.1 — 한 파일. 소리는 저장하지 않고 숫자만 기기 안에 둔다. 서버 없음. */
const VERSION = '0.2';
const Q = new URLSearchParams(location.search);
const DEMO = Q.get('demo');                       // up | down | result | null
const $ = s => document.querySelector(s);
const app = $('#app');

/* ── 기준값 (전부 임시. 실기기 기록을 보고 맞춘다) ── */
const CFG = {
  stepMin: +Q.get('min') || 0.035,   // 걸음으로 치는 최소 흔들림 (m/s²)
  t1: +Q.get('t1') || 0.09,          // 이 위는 '보통'
  t2: +Q.get('t2') || 0.22,          // 이 위는 '쿵'
  refractory: 260,                   // 걸음 사이 최소 간격 (ms)
  dbOffset: +Q.get('off') || 96,     // 마이크 dBFS → 대략 dB (보정 전)
  downSec: +Q.get('sec') || 600,     // 아랫집 한 번 재는 시간(초)
  thumpJump: 9                       // 저음이 바닥보다 이만큼(dB) 튀면 쿵 후보
};
const LIMIT = { night: { leq: 34, max: 52 }, day: { leq: 39, max: 57 } };   // 직접충격소음 기준(dB), 조문 원문 확인 필요
const isNight = (d = new Date()) => d.getHours() >= 22 || d.getHours() < 6;
const LV = [
  { name: '살금', cls: 'c-ok', why: '조용한 걸음이에요.<br>아래층까지 거의 안 갑니다.' },
  { name: '보통', cls: 'c-mid', why: '조금 울렸어요.<br>밤에는 더 살살 걸어 보세요.' },
  { name: '쿵', cls: 'c-bad', why: '뒤꿈치부터 디뎠어요.<br>아래층에 크게 울리는 걸음입니다.' }
];
const lvOf = v => v >= CFG.t2 ? 2 : v >= CFG.t1 ? 1 : 0;
const pawSize = (v, lv) => Math.round(15 + Math.min(1, v / (CFG.t2 * 1.6)) * 18);
const hhmm = t => { const d = new Date(t); const h = d.getHours(), m = String(d.getMinutes()).padStart(2, '0'); return (h < 12 ? '오전 ' : h < 18 ? '오후 ' : '밤 ') + (h % 12 || 12) + ':' + m; };
const hm = t => { const d = new Date(t); return d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); };

/* ── 상태 ── */
const S = { screen: 'home', mode: null, steps: [], counts: [0, 0, 0], thumps: [], t0: 0, tEnd: 0,
            leqBuf: [], leq1max: -Infinity, dbMax: -Infinity, dbNow: null, err: '', samples: 0 };

/* ── 그림 ── */
const IMG = {};
const loadImgs = () => Promise.all(['up_day', 'up_dim', 'dn_dim', 'dn_lit', 'slab', 'bunny', 'cat', 'emo', 'phone'].map(n => new Promise(res => {
  const im = new Image(); let tries = 0; im.onload = () => res();
  im.onerror = () => { if (++tries < 3) setTimeout(() => { im.src = 'img/' + n + '.png?r=' + tries; }, 600); else res(); };   // 그림이 안 오면 두 번 더 받아 본다
  im.src = 'img/' + n + '.png'; IMG[n] = im;
})));
const CW = 716, RH = 284, SLAB = 44, CH = RH * 2 + SLAB;
const SC = { cv: null, cx: null, ripples: [], bunnyX: 430, dir: 1, frame: 0, lastStepAt: 0, lastBadAt: -1e9, raf: 0 };

function ringPixels(cx, x0, y0, r, color, alpha) {
  cx.fillStyle = color; cx.globalAlpha = alpha;
  const seen = new Set();
  for (let t = 0; t <= 360; t++) {
    const a = Math.PI * t / 360;
    const gx = Math.floor((x0 + r * Math.cos(a)) / 4) * 4, gy = Math.floor((y0 + r * Math.sin(a) * 0.82) / 4) * 4;
    if (gy < RH + 6 || gy > CH - 8) continue;
    const k = gx + ',' + gy; if (seen.has(k)) continue; seen.add(k);
    cx.fillRect(gx, gy, 4, 4);
  }
  cx.globalAlpha = 1;
}
function drawScene(now) {
  const { cx } = SC; if (!cx) return;
  for (const k in IMG) if (!IMG[k].complete || !IMG[k].naturalWidth) return;      // 그림이 다 오기 전에는 그리지 않는다
  const up = S.mode !== 'down';
  cx.imageSmoothingEnabled = false;
  cx.drawImage(up ? IMG.up_day : IMG.up_dim, 0, 0);
  cx.drawImage(IMG.slab, 0, RH);
  cx.drawImage(up ? IMG.dn_dim : IMG.dn_lit, 0, RH + SLAB);
  // 폰
  if (up) cx.drawImage(IMG.phone, 560, 236); else cx.drawImage(IMG.phone, 250, RH + SLAB + 246);
  // 토끼(윗집)
  const walking = now - SC.lastStepAt < 420;
  const col = walking ? SC.frame % 3 : 0, rowB = SC.dir > 0 ? 3 : 2;
  if (!up) cx.globalAlpha = .55;
  cx.drawImage(IMG.bunny, col * 75, rowB * 112, 75, 112, Math.round(SC.bunnyX), 262 - 112, 75, 112);
  cx.globalAlpha = 1;
  // 고양이(아랫집)
  const alarmed = now - SC.lastBadAt < 2200;
  const cxp = up ? 236 : 130, cyp = RH + SLAB + (up ? 166 : 160);
  cx.drawImage(IMG.cat, alarmed ? 0 : 96, 0, 96, 96, cxp, cyp, 96, 96);
  cx.drawImage(IMG.emo, alarmed ? 0 : 64, 0, 64, 64, cxp + 30, cyp - 58 + Math.round(Math.sin(now / 500) * 2), 64, 64);
  // 울림
  SC.ripples = SC.ripples.filter(r => now - r.t < 1500);
  for (const r of SC.ripples) {
    const p = (now - r.t) / 1500, color = r.lv === 2 ? '#FF5A5F' : '#7C9BFF', k = r.lv === 0 ? .55 : 1;
    for (let i = 0; i < 4; i++) {
      const rad = 20 + (p * 230) - i * 34; if (rad < 14) continue;
      ringPixels(cx, r.x, RH + 6, rad, color, Math.max(0, (1 - p) * (1 - i * .2)) * k);
    }
  }
}
function loop(now) { drawScene(now); SC.raf = requestAnimationFrame(loop); }
function sceneStep(lv) {
  const now = performance.now();
  SC.frame++; SC.lastStepAt = now;
  SC.bunnyX += SC.dir * 22;
  if (SC.bunnyX > 470) SC.dir = -1; if (SC.bunnyX < 230) SC.dir = 1;
  SC.ripples.push({ t: now, lv, x: SC.bunnyX + 38 });
  if (lv === 2) { SC.lastBadAt = now; bubble('쿵!'); }
}
let bubbleT = 0;
function bubble(txt) {
  const b = $('#bubble'); if (!b) return;
  b.textContent = txt; b.style.left = ((SC.bunnyX + 38) / CW * 100) + '%'; b.style.top = (132 / CH * 100) + '%';
  b.classList.add('show'); clearTimeout(bubbleT); bubbleT = setTimeout(() => b.classList.remove('show'), 900);
}

/* ── 흔들림 센서 ── */
const MO = { on: false, g: [0, 0, 0], floor: 0.01, peak: 0, peakAt: 0, lastStep: 0, handler: null };
async function askMotion() {            // 아이폰은 누른 순간에만 허용 창이 뜬다 (머피 범프와 같은 방식)
  const need = t => typeof t !== 'undefined' && typeof t.requestPermission === 'function';
  if (need(window.DeviceMotionEvent)) { const r = await DeviceMotionEvent.requestPermission(); if (r !== 'granted') throw new Error('motion'); }
  if (typeof window.DeviceMotionEvent === 'undefined') throw new Error('nomotion');
}
function startMotion(onPeak) {
  MO.handler = e => {
    let a = e.acceleration, x, y, z;
    if (a && a.x != null) { x = a.x; y = a.y; z = a.z; }
    else { const g = e.accelerationIncludingGravity; if (!g || g.x == null) return;
      MO.g = [MO.g[0] * .9 + g.x * .1, MO.g[1] * .9 + g.y * .1, MO.g[2] * .9 + g.z * .1]; x = g.x - MO.g[0]; y = g.y - MO.g[1]; z = g.z - MO.g[2]; }
    const m = Math.hypot(x, y, z), now = performance.now();
    S.samples++;
    if (m < MO.floor * 3) MO.floor = MO.floor * .995 + m * .005;
    const thr = Math.max(CFG.stepMin, MO.floor * 4);
    if (MO.peak) {                                   // 꼭대기 찾는 중
      if (m > MO.peak) MO.peak = m;
      if (now - MO.peakAt > 110) { const v = MO.peak; MO.peak = 0; MO.lastStep = now; onPeak(v); }
    } else if (m > thr && now - MO.lastStep > CFG.refractory) { MO.peak = m; MO.peakAt = now; }
  };
  window.addEventListener('devicemotion', MO.handler); MO.on = true;
}
function stopMotion() { if (MO.handler) window.removeEventListener('devicemotion', MO.handler); MO.on = false; MO.peak = 0; }

/* ── 마이크 (소리는 저장하지 않는다. 크기 숫자만 계산하고 버린다) ── */
const MIC = { ctx: null, stream: null, an: null, lo: null, timer: 0, loFloor: -80, lastThump: 0 };
async function startMic(onTick) {
  MIC.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  MIC.ctx = new (window.AudioContext || window.webkitAudioContext)();
  const src = MIC.ctx.createMediaStreamSource(MIC.stream);
  MIC.an = MIC.ctx.createAnalyser(); MIC.an.fftSize = 2048; src.connect(MIC.an);
  const lp = MIC.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 200;      // 발소리는 낮은 소리
  MIC.lo = MIC.ctx.createAnalyser(); MIC.lo.fftSize = 2048; src.connect(lp); lp.connect(MIC.lo);
  const buf = new Float32Array(2048), buf2 = new Float32Array(2048);
  const rms = b => { let s = 0; for (let i = 0; i < b.length; i++) s += b[i] * b[i]; return 10 * Math.log10(s / b.length + 1e-12); };
  MIC.timer = setInterval(() => {
    MIC.an.getFloatTimeDomainData(buf); MIC.lo.getFloatTimeDomainData(buf2);
    const db = rms(buf) + CFG.dbOffset, lo = rms(buf2);
    let jump = false;
    if (lo < MIC.loFloor + 4) MIC.loFloor = MIC.loFloor * .95 + lo * .05; else MIC.loFloor += .02;
    if (lo > MIC.loFloor + CFG.thumpJump && performance.now() - MIC.lastThump > 400) { jump = true; MIC.lastThump = performance.now(); }
    onTick(db, jump);
  }, 100);
}
function stopMic() {
  clearInterval(MIC.timer);
  if (MIC.stream) MIC.stream.getTracks().forEach(t => t.stop());
  if (MIC.ctx) MIC.ctx.close();
  MIC.stream = MIC.ctx = null;
}

/* ── 화면 꺼짐 막기 ── */
let wake = null;
const keepAwake = async () => { try { wake = await navigator.wakeLock.request('screen'); } catch (e) {} };
const letSleep = () => { try { wake && wake.release(); } catch (e) {} wake = null; };
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.screen === 'run') keepAwake(); });

/* ── 화면 그리기 ── */
const sceneHtml = (up) => `
<div class="scene">
  <span class="tag ${up ? 'me' : ''}" style="top:10px">${up ? '윗집 우리 집' : '윗집'}</span>
  <span class="tag ${up ? '' : 'me'}" style="top:${((RH + SLAB) / CH * 100 + 3).toFixed(1)}%">${up ? '아랫집' : '아랫집 우리 집'}</span>
  <span class="bubble" id="bubble"></span>
  <canvas id="cv" width="${CW}" height="${CH}"></canvas>
</div>`;
const header = cap => `<div class="top"><div class="brand">살<em>금</em></div>${cap ? `<div class="cap">${cap}</div>` : ''}</div>`;
function mountScene() { SC.cv = $('#cv'); SC.cx = SC.cv ? SC.cv.getContext('2d') : null; cancelAnimationFrame(SC.raf); if (SC.cx) SC.raf = requestAnimationFrame(loop); }

function renderHome() {
  S.screen = 'home'; S.mode = null;
  app.innerHTML = header(`시험판 <b>${VERSION}</b>`) + sceneHtml(true) + `
  <div class="hero"><h1>폰을 바닥에 내려놓으세요</h1><p>걸음이 바닥을 타고 아래층으로 얼마나 가는지 보여 드려요.</p><p class="free">무료예요. 광고도 가입도 없고, 소리는 저장하지 않아요.</p></div>
  <button class="pick" id="pUp"><div class="pic" style="background-image:url(img/bunny.png);background-position:-9px -8px;background-size:225px 448px"></div>
    <div><b>윗집이에요</b><span>걸으면서 내 발소리를 봐요</span></div><span class="tri"></span></button>
  <button class="pick" id="pDown"><div class="pic" style="background-image:url(img/cat.png);background-position:-56px 2px;background-size:112px 56px"></div>
    <div><b>아랫집이에요</b><span>쿵 소리를 ${Math.round(CFG.downSec / 60)}분 세고 기준과 견줘요</span></div><span class="tri"></span></button>
  ${S.err ? `<p class="err">${S.err}</p>` : ''}
  <div class="spacer"></div>`;
  mountScene();
  $('#pUp').onclick = () => begin('up'); $('#pDown').onclick = () => begin('down');
}

async function begin(mode) {
  S.err = '';
  try {
    if (!DEMO) await askMotion();
    Object.assign(S, { mode, steps: [], counts: [0, 0, 0], thumps: [], t0: Date.now(), leqBuf: [], leq1max: -Infinity, dbMax: -Infinity, dbNow: null, samples: 0 });
    if (mode === 'up') { renderUp(); if (!DEMO) startMotion(onStep); }
    else {
      if (!DEMO) { await startMic(onMicTick); startMotion(v => onThump(v, true)); }
      renderDown();
    }
    S.screen = 'run'; keepAwake();
    if (DEMO) runDemo(mode);
  } catch (e) {
    stopAll();
    S.err = e && e.message === 'motion' ? '흔들림 센서 허용이 꺼져 있어요. 설정 > 사파리 > 동작 및 방향 접근을 켜고 다시 눌러 주세요.'
      : e && e.message === 'nomotion' ? '이 기기에서는 흔들림 센서를 읽을 수 없어요.'
      : '마이크나 센서를 켜지 못했어요. 허용을 누른 뒤 다시 시도해 주세요.';
    renderHome();
  }
}
function stopAll() { stopMotion(); stopMic(); letSleep(); clearInterval(tickT); }

/* 윗집 */
function onStep(v) {
  const lv = lvOf(v); S.steps.push({ t: Date.now(), v: +v.toFixed(4), lv }); S.counts[lv]++;
  sceneStep(lv); paintUp();
}
function renderUp() {
  app.innerHTML = header(`${hhmm(Date.now())}<u></u><b>${isNight() ? '밤 기준' : '낮 기준'}</b>`) + sceneHtml(true) + `
  <div class="card now"><div><div class="lbl">방금 걸음</div><div class="big" id="nBig" style="color:var(--t3)">대기</div></div>
    <div><div class="why" id="nWhy">폰 옆을 평소처럼 걸어 보세요.</div><div class="meter" id="nMeter">${'<span></span>'.repeat(10)}</div></div></div>
  <div class="card"><div class="h"><i class="ph-bold ph-footprints"></i>걸어온 발자국<span class="r num" id="nCount">0걸음</span></div>
    <div class="paws" id="nPaws"><em class="empty">아직 걸음이 없어요</em></div>
    <div class="split" id="nSplit"><i style="flex:0;background:var(--soft)"></i><i style="flex:0;background:var(--accent)"></i><i style="flex:0;background:var(--bad)"></i></div>
    <div class="legend"><div><s style="background:var(--soft)"></s>살금 <b class="num" id="c0">0</b></div><div><s style="background:var(--accent)"></s>보통 <b class="num" id="c1">0</b></div><div><s style="background:var(--bad)"></s>쿵 <b class="num" id="c2">0</b></div></div></div>
  <div class="tip"><span class="badge" style="margin-left:0">걸음 팁</span><p>발 앞쪽부터 디디면 살금 걸음이 돼요</p></div>
  <div class="spacer"></div>
  <div class="row"><button class="btn grow" id="bStop"><span class="sqi"></span>그만 재기</button><button class="btn sq" id="bExp">기록 보내기</button></div>`;
  mountScene();
  $('#bStop').onclick = () => { stopAll(); renderHome(); };
  $('#bExp').onclick = exportLog;
}
function paintUp() {
  const last = S.steps[S.steps.length - 1]; if (!last || !$('#nBig')) return;
  const L = LV[last.lv];
  $('#nBig').textContent = L.name; $('#nBig').style.color = ''; $('#nBig').className = 'big ' + L.cls;
  $('#nWhy').innerHTML = L.why;
  const n = Math.max(1, Math.min(10, Math.round(last.v / (CFG.t2 * 1.4) * 10)));
  $('#nMeter').innerHTML = Array.from({ length: 10 }, (_, i) => `<span style="${i < n ? 'background:' + (i >= 7 ? 'var(--bad)' : i >= 4 ? 'var(--accent)' : 'var(--soft)') : ''}"></span>`).join('');
  $('#nCount').textContent = S.steps.length + '걸음째';
  $('#nPaws').innerHTML = S.steps.slice(-14).map(s => `<i class="ph-fill ph-paw-print ${LV[s.lv].cls}" style="font-size:${pawSize(s.v, s.lv)}px"></i>`).join('');
  [0, 1, 2].forEach(i => { $('#c' + i).textContent = S.counts[i]; $('#nSplit').children[i].style.flex = S.counts[i]; });
}

/* 아랫집 */
let tickT = 0;
function onMicTick(db, jump) {
  S.dbNow = db; if (db > S.dbMax) S.dbMax = db;
  S.leqBuf.push(Math.pow(10, db / 10)); if (S.leqBuf.length > 600) S.leqBuf.shift();          // 최근 1분(100ms × 600)
  if (S.leqBuf.length >= 600) { const leq = 10 * Math.log10(S.leqBuf.reduce((a, b) => a + b, 0) / S.leqBuf.length); if (leq > S.leq1max) S.leq1max = leq; }
  if (jump) onThump(db, false);
}
function onThump(v, shook) {
  const now = Date.now(), last = S.thumps[S.thumps.length - 1];
  if (last && now - last.t < 350) { if (shook) last.shook = true; return; }                 // 같은 쿵을 두 번 세지 않는다
  const db = S.dbNow == null ? null : +S.dbNow.toFixed(1);
  S.thumps.push({ t: now, db, shook: !!shook });
  const lv = db != null && db >= LIMIT[isNight() ? 'night' : 'day'].max ? 2 : 1;
  SC.frame++; SC.lastStepAt = performance.now(); SC.bunnyX += SC.dir * 22; if (SC.bunnyX > 470) SC.dir = -1; if (SC.bunnyX < 230) SC.dir = 1;
  SC.ripples.push({ t: performance.now(), lv, x: SC.bunnyX + 38 }); SC.lastBadAt = performance.now();
  paintDown();
}
function renderDown() {
  app.innerHTML = header(`${Math.round(CFG.downSec / 60)}분 재는 중<u></u><b>${isNight() ? '밤 기준' : '낮 기준'}</b>`) + sceneHtml(false) + `
  <div class="card"><div class="live"><div><div class="lbl">지금까지 들린 쿵</div><div class="big num"><span id="dN">0</span><small>번</small></div></div>
    <div class="side">지금 소리 <b class="num" id="dDb">-</b><br>남은 시간 <b class="num" id="dLeft">-</b></div></div>
    <div class="prog"><i id="dProg"></i></div></div>
  <div class="tip"><span class="badge" style="margin-left:0">소리 저장 안 함</span><p>폰을 바닥에 두고 조용히 기다려 주세요</p></div>
  <div class="spacer"></div>
  <div class="row"><button class="btn grow" id="bStop"><span class="sqi"></span>그만하고 결과 보기</button></div>`;
  mountScene();
  $('#bStop').onclick = finishDown;
  clearInterval(tickT); tickT = setInterval(paintDown, 500); paintDown();
}
function paintDown() {
  if (!$('#dN')) return;
  const el = (Date.now() - S.t0) / 1000, left = Math.max(0, CFG.downSec - el);
  $('#dN').textContent = S.thumps.length;
  $('#dDb').textContent = S.dbNow == null ? '-' : '약 ' + Math.round(S.dbNow) + 'dB';
  $('#dLeft').textContent = Math.floor(left / 60) + ':' + String(Math.floor(left % 60)).padStart(2, '0');
  $('#dProg').style.width = Math.min(100, el / CFG.downSec * 100) + '%';
  if (left <= 0 && !DEMO) finishDown();
}
function finishDown() { S.tEnd = Date.now(); stopAll(); renderResult(); }

function verdictOf() {
  const lim = LIMIT[isNight(new Date(S.t0)) ? 'night' : 'day'], secs = (S.tEnd - S.t0) / 1000;
  if (secs < 60 || !isFinite(S.leq1max)) return { key: 'na', title: '확인 못 함', text: '1분 넘게 재야 기준과 견줄 수 있어요.', pos: null, lim };
  const d = S.leq1max - lim.leq, over = d >= 0 || S.dbMax >= lim.max;
  const pos = Math.max(4, Math.min(96, 60 + d * 4));
  if (over) return { key: 'over', title: '기준을 넘은 것으로 보임', pos, lim };
  if (d >= -5) return { key: 'near', title: '기준 근처', pos, lim };
  return { key: 'in', title: '기준 안쪽으로 보임', pos, lim };
}
function renderResult() {
  S.screen = 'result';
  const v = verdictOf(), span = Math.max(1, S.tEnd - S.t0), shook = S.thumps.filter(t => t.shook).length;
  const night = isNight(new Date(S.t0));
  // 가장 심한 2분
  let win = null;
  if (span > 240000 && S.thumps.length >= 3) { let best = 0, at = 0; for (let a = S.t0; a + 120000 <= S.tEnd; a += 15000) { const n = S.thumps.filter(t => t.t >= a && t.t < a + 120000).length; if (n > best) { best = n; at = a; } }
    if (best >= 3) win = { l: (at - S.t0) / span * 100, w: 120000 / span * 100 }; }
  const paws = S.thumps.map(t => { const x = (t.t - S.t0) / span * 100, big = t.db != null && t.db >= v.lim.max;
    return `<i class="ph-fill ph-paw-print ${big ? 'c-bad' : t.shook ? 'c-mid' : 'c-ok'}" style="left:${x.toFixed(1)}%;font-size:${big ? 25 : t.shook ? 21 : 16}px"></i>`; }).join('');
  const line = v.key === 'na' ? v.text
    : `1분 평균 최고 <b class="num">약 ${Math.round(S.leq1max)}dB</b>. ${night ? '밤' : '낮'} 기준은 <b class="num">${v.lim.leq}dB</b>입니다.`;
  app.innerHTML = header(`${Math.max(1, Math.round(span / 60000))}분 쟀어요<u></u><b>${hm(S.t0)}~${hm(S.tEnd)}</b>`) + sceneHtml(false) + `
  <div class="card verdict"><div class="lbl">법으로 정한 기준과 견주면</div><div class="big ${v.key === 'over' ? 'c-bad' : ''}">${v.title}</div><p>${line}</p>
    ${v.pos == null ? '' : `<div class="scale"><div class="bar"><i style="flex:4;background:var(--soft)"></i><i style="flex:2;background:var(--accent)"></i><i style="flex:4;background:var(--bad);opacity:.4"></i></div>
      <div class="pin" style="left:${v.pos}%"></div><div class="lab"><span style="flex:4">기준 안쪽</span><span style="flex:2;color:#fff">근처</span><span style="flex:4">기준 넘음</span></div></div>`}</div>
  <div class="card"><div class="h"><i class="ph-bold ph-clock-countdown"></i>쿵이 난 때<span class="r">크고 밝을수록 센 쿵</span></div>
    <div class="tl"><div class="rail"></div>${win ? `<div class="win" style="left:${win.l.toFixed(1)}%;width:${win.w.toFixed(1)}%"><em>가장 심한 2분</em></div>` : ''}${paws}</div>
    <div class="ticks num"><span>${hm(S.t0)}</span><span>${hm((S.t0 + S.tEnd) / 2)}</span><span>${hm(S.tEnd)}</span></div></div>
  <div class="card"><div class="sum"><div class="pic" style="background-position:${S.thumps.length ? '0 0' : '-64px 0'}"></div>
    <div><div class="n num">${S.thumps.length}<small>번 쿵</small></div><div class="d">${S.thumps.length ? `그중 <b>${shook}번</b>은 바닥도 함께 울렸어요` : '쿵 소리가 잡히지 않았어요'}</div></div></div>
    <div class="stat"><div>가장 큰 순간<b class="num">${isFinite(S.dbMax) ? '약 ' + Math.round(S.dbMax) + 'dB' : '-'}</b></div><div>${night ? '밤' : '낮'} 최고 기준<b class="num">${v.lim.max}dB</b></div></div></div>
  <div class="note"><span class="badge" style="margin-left:0">알아 두세요</span><p>폰은 공인 소음계가 아니고, 이 숫자는 보정 전 값입니다. 소리는 저장하지 않았어요.<br>공식 측정 신청은 <b>이웃사이센터 1661-2642</b></p></div>
  <div class="row"><button class="btn grow" id="bAgain"><span class="tri"></span>다시 재기</button><button class="btn sq" id="bExp">기록 보내기</button></div>`;
  S.mode = 'down'; mountScene();
  $('#bAgain').onclick = renderHome; $('#bExp').onclick = exportLog;
}

/* 기록 내보내기 (기준값을 맞추는 데 쓴다. 숫자뿐이고 소리는 없다) */
async function exportLog() {
  const data = { app: 'salgeum', v: VERSION, at: new Date().toISOString(), ua: navigator.userAgent, cfg: CFG, mode: S.mode, t0: S.t0, tEnd: S.tEnd || Date.now(),
    motionSamples: S.samples, floor: +MO.floor.toFixed(4), steps: S.steps, thumps: S.thumps, leq1max: isFinite(S.leq1max) ? +S.leq1max.toFixed(1) : null, dbMax: isFinite(S.dbMax) ? +S.dbMax.toFixed(1) : null };
  const txt = JSON.stringify(data), file = new File([txt], 'salgeum-' + Date.now() + '.json', { type: 'application/json' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; } } catch (e) { return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name; a.click();
}

/* 가짜 센서값 (화면 확인용, ?demo=up|down|result) */
function runDemo(mode) {
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  if (mode === 'up') {
    const vs = [.05, .04, .07, .12, .05, .26, .13, .04, .06, .11, .05, .31, .14, .06, .05, .04, .07, .12, .05, .06, .1, .34];
    vs.forEach(v => { const lv = lvOf(v); S.steps.push({ t: Date.now(), v, lv }); S.counts[lv]++; sceneStep(lv); }); paintUp();
    const b = $('#bubble'); if (b) { b.textContent = '쿵!'; b.classList.add('show'); clearTimeout(bubbleT); b.style.left = ((SC.bunnyX + 38) / CW * 100) + '%'; b.style.top = (132 / CH * 100) + '%'; }
  } else {
    S.t0 = Date.now() - 600000; S.dbNow = 31;
    [.06, .14, .27, .41, .45, .49, .53, .57, .71, .78, .9, .95].forEach((p, i) => S.thumps.push({ t: S.t0 + p * 600000, db: 38 + Math.round(rnd() * 11), shook: i % 4 !== 3 }));
    S.leq1max = 33.2; S.dbMax = 49;
    if (DEMO === 'result') { S.tEnd = S.t0 + 600000; renderResult(); SC.ripples.push({ t: performance.now() - 500, lv: 1, x: 340 }); }
    else { S.t0 = Date.now() - 372000; S.thumps.forEach(t => t.t -= 0); S.thumps = S.thumps.slice(0, 7); paintDown(); SC.ripples.push({ t: performance.now() - 500, lv: 1, x: 340 }); SC.lastBadAt = performance.now(); }
  }
}

loadImgs().then(() => { renderHome(); if (DEMO) begin(DEMO === 'result' ? 'down' : DEMO); });
</script>
</body>
</html>
