<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>머피 에셋 리터치</title>
<style>
:root{--blue:#3D7EFF;--gold:#F5C24B;--bg:#101012;--panel:#1b1b1f;--line:#2e2e34;
      --tx:#f2f2f4;--dim:#9a9aa4}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:14px/1.5 Pretendard,-apple-system,'Malgun Gothic',sans-serif;
     display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* 상단 툴바 — 그림판처럼 */
#bar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--panel);
     border-bottom:1px solid var(--line);flex:none}
#bar .t{display:flex;flex-direction:column;align-items:center;justify-content:center;
        width:52px;height:46px;border:1px solid var(--line);border-radius:8px;background:#26262c;
        cursor:pointer;font-size:10px;color:var(--dim);gap:2px}
#bar .t.on{border-color:var(--blue);background:#2b3550;color:var(--tx)}
#bar .t:hover{border-color:var(--blue)}
#bar .t svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;
            stroke-linecap:round;stroke-linejoin:round}
#bar .sep{width:1px;height:34px;background:var(--line);margin:0 4px}
#bar label{font-size:11px;color:var(--dim)}
#bar input[type=range]{width:110px}

main{flex:1;display:flex;min-height:0}
#side{width:250px;flex:none;background:var(--panel);border-right:1px solid var(--line);
      padding:12px;overflow-y:auto}
#stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;background:#08080a}
#chat{width:320px;flex:none;background:var(--panel);border-left:1px solid var(--line);
      display:flex;flex-direction:column}

h2{font-size:11px;color:var(--dim);letter-spacing:.3px;margin:0 0 6px}
.grp{margin-bottom:14px}
select,textarea,input[type=password]{width:100%;background:#26262c;color:var(--tx);
  border:1px solid var(--line);border-radius:7px;padding:7px;font:inherit;font-size:12px}
textarea{resize:none}
#gal{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.card{border:1px solid var(--line);border-radius:8px;padding:5px;cursor:pointer;background:#26262c;text-align:center}
.card:hover{border-color:var(--blue)}
.card.on{border-color:var(--blue);background:#2b3550}
.card img{width:100%;height:48px;object-fit:contain;image-rendering:pixelated;display:block}
.card span{display:block;font-size:10px;color:var(--dim);margin-top:3px;
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#wrap{position:relative;line-height:0}
canvas{image-rendering:pixelated;display:block}
#sel{position:absolute;left:0;top:0;cursor:crosshair}

/* 오른쪽 채팅 */
#log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:92%;padding:8px 10px;border-radius:10px;font-size:12.5px;line-height:1.55;
     white-space:pre-wrap;word-break:break-word}
.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:3px}
.ai{align-self:flex-start;background:#26262c;border:1px solid var(--line);border-bottom-left-radius:3px}
.ai b{color:var(--gold);font-weight:600}
#ask{border-top:1px solid var(--line);padding:10px;flex:none}
#ask .row{display:flex;gap:6px;margin-top:6px}
button{border:1px solid var(--line);border-radius:8px;background:#26262c;color:var(--tx);
       font:inherit;font-size:12.5px;padding:8px 10px;cursor:pointer}
button:hover{border-color:var(--blue)}
button.go{background:var(--blue);border-color:var(--blue);font-weight:600;flex:1}
button.go:hover{background:#5590ff}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chips button{font-size:11px;padding:5px 8px;border-radius:20px;color:var(--dim)}
.note{font-size:11px;color:var(--dim);line-height:1.6}
</style>
</head>
<body>

<div id="bar">
  <div class="t on" data-tool="brush" title="붓 (B)">
    <svg viewBox="0 0 24 24"><path d="M4 20c0-2 1-3 3-3 1.5 0 2.5 1 2.5 2.2C9.5 20.6 8 21 6 21H4v-1z"/><path d="M9 17 19.5 6.5a2.1 2.1 0 0 0-3-3L6 14"/></svg>
    붓
  </div>
  <div class="t" data-tool="rect" title="사각 선택 (R)">
    <svg viewBox="0 0 24 24"><path d="M4 7V5h3M20 7V5h-3M4 17v2h3M20 17v2h-3M4 10v4M20 10v4M10 5h4M10 19h4" stroke-dasharray="3 2"/></svg>
    사각선택
  </div>
  <div class="t" data-tool="unbrush" title="선택 지우개 (E)">
    <svg viewBox="0 0 24 24"><path d="M7 21h10M5.5 15.5 12 9l5 5-6.5 6.5H8z"/><path d="M12 9l3.5-3.5a2 2 0 0 1 3 0l2 2a2 2 0 0 1 0 3L17 14"/></svg>
    선택지우개
  </div>
  <div class="sep"></div>
  <div class="t" id="tAll" title="전체 선택">
    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 12l3 3 5-6"/></svg>
    전체
  </div>
  <div class="t" id="tNone" title="선택 해제">
    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" stroke-dasharray="3 2"/><path d="M9 15 15 9M9 9l6 6"/></svg>
    선택해제
  </div>
  <div class="t" id="tUndo" title="되돌리기 (Ctrl+Z)">
    <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
    되돌리기
  </div>
  <div class="sep"></div>
  <div class="t" data-tool="pen" title="연필 — 픽셀 직접 찍기 (P)">
    <svg viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></svg>
    연필
  </div>
  <div class="t" data-tool="del" title="픽셀 지우개 (D)">
    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" stroke-dasharray="2 2"/><path d="M9 9l6 6M15 9l-6 6"/></svg>
    픽셀지우개
  </div>
  <div class="t" data-tool="pipe" title="스포이드 (I)">
    <svg viewBox="0 0 24 24"><path d="M5 19l1-4 8-8 3 3-8 8z"/><path d="M14 4l6 6"/></svg>
    스포이드
  </div>
  <div id="sw" title="현재 색" style="width:30px;height:30px;border-radius:7px;
       border:2px solid var(--line);background:#2b2b31"></div>
  <div id="pal" style="display:flex;flex-wrap:wrap;gap:3px;max-width:150px"></div>
  <div class="sep"></div>
  <label>붓 <b id="bsz">6</b></label>
  <input type="range" id="brush" min="1" max="30" value="6">
  <label>확대 <b id="zl">5</b>x</label>
  <input type="range" id="zoom" min="2" max="10" value="5">
  <div class="sep"></div>
  <div class="t" id="tSave" title="저장">
    <svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>
    저장
  </div>
</div>

<main>
  <div id="side">
    <div class="grp">
      <h2>아이템</h2>
      <select id="slot">
        <option value="hair">헤어</option><option value="hat">모자</option>
        <option value="top">상의</option><option value="bottom">하의</option>
        <option value="shoes">신발</option><option value="acc">액세서리</option>
      </select>
      <div id="gal"></div>
    </div>
    <div class="grp">
      <h2>보는 방향</h2>
      <select id="dir"></select>
      <div class="note" style="margin-top:6px">고치면 걸음 3프레임에 같이 반영됩니다.</div>
    </div>
    <div class="grp" id="gWarn" style="display:none">
      <div class="note" style="color:var(--gold)">
        직접 열면 브라우저가 픽셀 읽기를 막습니다.<br><b>retouch.bat</b> 으로 여세요.
      </div>
    </div>
  </div>

  <div id="stage"><div id="wrap"><canvas id="view"></canvas><canvas id="sel"></canvas></div></div>

  <div id="chat">
    <div id="log">
      <div class="msg ai">고칠 부분을 <b>붓</b>이나 <b>사각선택</b>으로 칠한 뒤, 무엇을 할지 말해주세요.
저는 칠한 영역 안에서만 손댑니다.</div>
    </div>
    <div id="ask">
      <textarea id="prompt" rows="2" placeholder="예) 귀 옆에 검은 선 한 겹 더 그려진 거 빼줘"></textarea>
      <div class="chips">
        <button data-q="칠한 데 머리색으로 덮어줘">머리색으로 덮기</button>
        <button data-q="여기 검은 줄 없애줘">검은 줄 빼기</button>
        <button data-q="여기 살색 없애줘">살색 빼기</button>
        <button data-q="구멍 메워줘">구멍 메우기</button>
        <button data-q="여기 지워줘">지우기</button>
      </div>
      <div class="row"><button class="go" id="run">보내기</button></div>
      <input type="password" id="apikey" placeholder="Anthropic API 키 (선택)" style="margin-top:6px">
      <div class="note">키를 넣으면 문장을 그대로 이해합니다. 없으면 키워드로 해석합니다.</div>
    </div>
  </div>
</main>

<script>
const CW=141, CH=224, ROWS=['정면','후면','좌','우'];
const ITEMS=[
 {id:'hair_m_basic',slot:'hair',body:'human',name:'남자 기본헤어'},
 {id:'hair_ivyleague',slot:'hair',body:'human',name:'아이비리그컷'},
 {id:'hair_m_semileaf',slot:'hair',body:'human',name:'세미리프컷'},
 {id:'hair_m_part55',slot:'hair',body:'human',name:'오대오 가르마펌'},
 {id:'hair_f_basic',slot:'hair',body:'human_f',name:'여자 기본헤어'},
 {id:'hair_f_bob_bang',slot:'hair',body:'human_f',name:'앞머리 단발'},
 {id:'hair_f_long',slot:'hair',body:'human_f',name:'긴 생머리'},
 {id:'hat_beanie',slot:'hat',body:'human',name:'GBD 비니'},
 {id:'hat_ladodgers',slot:'hat',body:'human',name:'LA 볼캡'},
 {id:'acc_airpodsmax',slot:'acc',body:'human',name:'에어팟 맥스'},
 {id:'top_redhood',slot:'top',body:'human',name:'레드 후디'},
 {id:'top_ringer',slot:'top',body:'human',name:'ART 링거티'},
 {id:'bottom_bermuda',slot:'bottom',body:'human',name:'회색 버뮤다'},
 {id:'bottom_trainpt',slot:'bottom',body:'human',name:'검정 트레이닝'},
 {id:'shoes_white',slot:'shoes',body:'human',name:'흰색 러닝화'},
 {id:'shoes_black',slot:'shoes',body:'human',name:'검정 러닝화'},
];
const ROOT='../../';
const OPS={
  fill:'칠한 곳을 아이템 색(머리카락 등)으로 덮는다',
  erase:'칠한 곳의 아이템 픽셀을 지워 투명하게 한다',
  dark:'칠한 곳에서 어두운(검은 선) 픽셀만 지운다. maxDark=어디까지 어둡다고 볼지(0~255)',
  skin:'칠한 곳에서 살색 픽셀만 지운다',
  hole:'칠한 곳의 빈 구멍만 아이템 색으로 메운다',
};

let baseImg=null,itemData=null,W=0,H=0,cellR=0,Z=5,curItem=null,tool='brush',brush=6;
const history=[];
const $=id=>document.getElementById(id);
const view=$('view'),sel=$('sel'),vctx=view.getContext('2d'),sctx=sel.getContext('2d');

function say(t,me){const d=document.createElement('div');d.className='msg '+(me?'me':'ai');
  d.innerHTML=t;$('log').appendChild(d);$('log').scrollTop=1e9;}

/* ── 로딩 ─────────────────────────────────────────────── */
// ★crossOrigin 을 붙이면 같은 서버인데도 CORS 헤더를 요구해 로딩이 통째로 실패한다.
function loadPng(url){return new Promise((res,rej)=>{const im=new Image();
  im.onload=()=>{const c=document.createElement('canvas');c.width=im.width;c.height=im.height;
    const x=c.getContext('2d');x.drawImage(im,0,0);
    try{res(x.getImageData(0,0,im.width,im.height));}catch(e){rej(e);}};
  im.onerror=()=>rej(new Error(url));im.src=url;});}

function renderGal(){
  const s=$('slot').value,g=$('gal');g.innerHTML='';
  ITEMS.filter(i=>i.slot===s).forEach(it=>{
    const d=document.createElement('div');d.className='card';d.title=it.name;
    d.innerHTML='<img src="'+ROOT+'char/items/'+it.id+'_thumb.png" alt=""><span>'+it.name+'</span>';
    d.onclick=()=>pick(it,d);g.appendChild(d);});
}
async function pick(it,el){
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('on'));
  if(el)el.classList.add('on');
  try{
    baseImg=await loadPng(ROOT+'char/'+(it.body==='human_f'?'walk_female.png':'walk.png'));
    const d=await loadPng(ROOT+'char/items/'+it.id+'.png');
    itemData=new ImageData(new Uint8ClampedArray(d.data),d.width,d.height);
    W=d.width;H=d.height;curItem=it;history.length=0;
    const dir=$('dir');
    if(!dir.options.length){for(let r=0;r<Math.round(H/CH);r++){
      const o=document.createElement('option');o.value=r;o.textContent=ROWS[r]||('행'+r);dir.appendChild(o);}
      dir.onchange=()=>{cellR=+dir.value;clearSel();draw();};}
    resize();clearSel();draw();buildPal();
    say(it.name+' 을 불러왔습니다. 고칠 부분을 칠해주세요.');
  }catch(e){ $('gWarn').style.display='block'; say('불러오지 못했습니다. <b>retouch.bat</b> 으로 열어주세요.'); }
}
$('slot').onchange=renderGal; renderGal();
if(location.protocol==='file:') $('gWarn').style.display='block';

/* ── 화면 ─────────────────────────────────────────────── */
function resize(){view.width=sel.width=CW*Z;view.height=sel.height=CH*Z;}
function draw(){
  if(!itemData)return;
  const out=vctx.createImageData(CW,CH);
  for(let y=0;y<CH;y++)for(let x=0;x<CW;x++){
    const i=((cellR*CH+y)*W+x)*4,o=(y*CW+x)*4;
    const chk=((x>>2)+(y>>2))&1?26:34;let r=chk,g=chk,b=chk;
    if(baseImg.data[i+3]>=128){r=baseImg.data[i];g=baseImg.data[i+1];b=baseImg.data[i+2];}
    if(itemData.data[i+3]>=128){r=itemData.data[i];g=itemData.data[i+1];b=itemData.data[i+2];}
    out.data[o]=r;out.data[o+1]=g;out.data[o+2]=b;out.data[o+3]=255;}
  const t=document.createElement('canvas');t.width=CW;t.height=CH;
  t.getContext('2d').putImageData(out,0,0);
  vctx.imageSmoothingEnabled=false;vctx.clearRect(0,0,view.width,view.height);
  vctx.drawImage(t,0,0,CW*Z,CH*Z);
}

/* ── 선택 (붓 / 사각) ─────────────────────────────────── */
let M=new Uint8Array(CW*CH);
function clearSel(){M.fill(0);paintSel();}
function paintSel(){
  sctx.clearRect(0,0,sel.width,sel.height);
  sctx.fillStyle='rgba(61,126,255,.45)';
  for(let y=0;y<CH;y++)for(let x=0;x<CW;x++) if(M[y*CW+x]) sctx.fillRect(x*Z,y*Z,Z,Z);
}
const pos=e=>{const b=sel.getBoundingClientRect();
  return [Math.floor((e.clientX-b.left)/Z),Math.floor((e.clientY-b.top)/Z)];};
function dab(x,y,on){const h=brush>>1;
  for(let j=-h;j<=h;j++)for(let i=-h;i<=h;i++){const px=x+i,py=y+j;
    if(px>=0&&px<CW&&py>=0&&py<CH) M[py*CW+px]=on?1:0;}}
/* ── 픽셀 직접 그리기 (연필·지우개·스포이드) ─────────────── */
// ★그리기도 걸음 3프레임에 같이 반영한다. 한 프레임만 찍으면 걸을 때 깜빡인다.
let ink=[40,36,42];
function setInk(c){ink=c;$('sw').style.background='rgb('+c.join(',')+')';}
function buildPal(){
  if(!itemData)return;
  const cnt={},p=$('pal');
  for(let y=0;y<CH;y++)for(let x=0;x<CW;x++){const i=((cellR*CH+y)*W+x)*4;
    if(itemData.data[i+3]>=128){const k=itemData.data[i]+','+itemData.data[i+1]+','+itemData.data[i+2];
      cnt[k]=(cnt[k]||0)+1;}}
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,10);
  p.innerHTML='';
  top.forEach(([k])=>{const c=k.split(',').map(Number);
    const d=document.createElement('div');
    d.style.cssText='width:14px;height:14px;border-radius:3px;cursor:pointer;'+
      'border:1px solid #444;background:rgb('+k+')';
    d.onclick=()=>setInk(c);p.appendChild(d);});
  if(top.length)setInk(top[0][0].split(',').map(Number));
}
function pixel(x,y,mode){          // mode: 'pen' | 'del'
  const nc=Math.round(W/CW),ref=bbox(0);let n=0;
  for(let c=0;c<nc;c++){
    const bb=bbox(c),dx=(ref&&bb)?bb[0]-ref[0]:0,dy=(ref&&bb)?bb[1]-ref[1]:0;
    const h=Math.max(0,(brush>>1)-((brush>>1)?0:0));
    for(let j=-(brush>>1);j<=(brush>>1);j++)for(let i2=-(brush>>1);i2<=(brush>>1);i2++){
      const px=x+i2+dx,py=y+j+dy;
      if(px<0||px>=CW||py<0||py>=CH)continue;
      const i=((cellR*CH+py)*W+(c*CW+px))*4;
      if(mode==='del'){itemData.data[i+3]=0;}
      else{itemData.data[i]=ink[0];itemData.data[i+1]=ink[1];itemData.data[i+2]=ink[2];
           itemData.data[i+3]=255;}
      n++;}
  }
  return n;
}
function pickColor(x,y){
  const i=((cellR*CH+y)*W+x)*4;
  if(itemData.data[i+3]>=128)setInk([itemData.data[i],itemData.data[i+1],itemData.data[i+2]]);
  else if(baseImg.data[i+3]>=128)setInk([baseImg.data[i],baseImg.data[i+1],baseImg.data[i+2]]);
}

let down=false,rect=null,drew=false;
sel.onmousedown=e=>{down=true;const[x,y]=pos(e);
  if(tool==='pipe'){pickColor(x,y);down=false;return;}
  if(tool==='pen'||tool==='del'){snap();drew=true;pixel(x,y,tool);draw();return;}
  if(tool==='rect'){rect=[x,y,x,y];} else {dab(x,y,tool==='brush');paintSel();}};
sel.onmousemove=e=>{if(!down)return;const[x,y]=pos(e);
  if(tool==='pen'||tool==='del'){pixel(x,y,tool);draw();return;}
  if(tool==='rect'){rect[2]=x;rect[3]=y;paintSel();
    sctx.strokeStyle='#3D7EFF';sctx.lineWidth=2;sctx.setLineDash([6,4]);
    sctx.strokeRect(Math.min(rect[0],x)*Z,Math.min(rect[1],y)*Z,
      (Math.abs(x-rect[0])+1)*Z,(Math.abs(y-rect[1])+1)*Z);}
  else{dab(x,y,tool==='brush');paintSel();}};
window.onmouseup=()=>{
  if(down&&tool==='rect'&&rect){
    const[x0,y0,x1,y1]=rect;
    for(let y=Math.min(y0,y1);y<=Math.max(y0,y1);y++)
      for(let x=Math.min(x0,x1);x<=Math.max(x0,x1);x++)
        if(x>=0&&x<CW&&y>=0&&y<CH) M[y*CW+x]=1;
    rect=null;paintSel();}
  down=false;};

document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-tool]').forEach(o=>o.classList.remove('on'));
  b.classList.add('on');tool=b.dataset.tool;});
$('tAll').onclick=()=>{M.fill(1);paintSel();};
$('tNone').onclick=clearSel;
$('brush').oninput=e=>{brush=+e.target.value;$('bsz').textContent=brush;};
$('zoom').oninput=e=>{Z=+e.target.value;$('zl').textContent=Z;resize();draw();paintSel();};
addEventListener('keydown',e=>{
  if(e.key==='b')document.querySelector('[data-tool=brush]').click();
  if(e.key==='r')document.querySelector('[data-tool=rect]').click();
  if(e.key==='e')document.querySelector('[data-tool=unbrush]').click();
  if(e.ctrlKey&&e.key==='z')$('tUndo').click();});

/* ── 보정 ─────────────────────────────────────────────── */
function snap(){history.push(new Uint8ClampedArray(itemData.data));if(history.length>40)history.shift();}
$('tUndo').onclick=()=>{if(!history.length)return;itemData.data.set(history.pop());draw();
  say('되돌렸습니다.');};

function bbox(c){let x0=1e9,y0=1e9,ok=false;
  for(let y=0;y<CH;y++)for(let x=0;x<CW;x++){
    const i=((cellR*CH+y)*W+(c*CW+x))*4;
    if(itemData.data[i+3]>=128){if(x<x0)x0=x;if(y<y0)y0=y;ok=true;}}
  return ok?[x0,y0]:null;}

// ★걸음 3프레임에 같이 적용한다. 한 프레임만 고치면 걸을 때 깜빡인다.
//   프레임마다 아이템이 평행이동해 있어 bbox 차이만큼 선택영역을 밀어서 적용한다.
function apply(cmd,opt){
  if(!itemData)return 0;
  if(!M.some(v=>v)){say('먼저 고칠 부분을 칠해주세요.');return 0;}
  snap();
  const nc=Math.round(W/CW),ref=bbox(0);let n=0;
  for(let c=0;c<nc;c++){
    const bb=bbox(c);
    n+=cell(cmd,opt,c,(ref&&bb)?bb[0]-ref[0]:0,(ref&&bb)?bb[1]-ref[1]:0);
  }
  draw();return n;
}
function cell(cmd,opt,col,dx,dy){
  const idx=(x,y)=>(((cellR*CH+y)*W+(col*CW+x))*4);
  const pal=[];
  for(let y=0;y<CH;y++)for(let x=0;x<CW;x++){const i=idx(x,y);
    if(itemData.data[i+3]>=128)pal.push([itemData.data[i],itemData.data[i+1],itemData.data[i+2],x,y]);}
  const near=(x,y)=>{let b=null,bd=1e9;for(const p of pal){const d=(p[3]-x)**2+(p[4]-y)**2;
    if(d<bd){bd=d;b=p;}}return b;};
  const maxDark=(opt&&opt.maxDark)||90;let n=0;
  for(let y=0;y<CH;y++)for(let x=0;x<CW;x++){
    const sx=x-dx,sy=y-dy;
    if(sx<0||sx>=CW||sy<0||sy>=CH||!M[sy*CW+sx])continue;
    const i=idx(x,y),a=itemData.data[i+3],
          r=itemData.data[i],g=itemData.data[i+1],b=itemData.data[i+2];
    if(cmd==='erase'){if(a>0){itemData.data[i+3]=0;n++;}}
    else if(cmd==='dark'){if(a>=128&&Math.max(r,g,b)<=maxDark){itemData.data[i+3]=0;n++;}}
    else if(cmd==='skin'){if(a>=128&&r>=140&&r>g+30&&g>b+5){itemData.data[i+3]=0;n++;}}
    else if(cmd==='fill'||cmd==='hole'){
      if(cmd==='hole'&&a>=128)continue;
      const p=near(x,y);if(!p)continue;
      itemData.data[i]=p[0];itemData.data[i+1]=p[1];itemData.data[i+2]=p[2];
      itemData.data[i+3]=255;n++;}
  }
  return n;
}

/* ── 지시 해석 ────────────────────────────────────────── */
const key=$('apikey');
key.value=localStorage.getItem('murpy_ak')||'';
key.onchange=()=>localStorage.setItem('murpy_ak',key.value.trim());

function localPlan(t){
  const s=t.replace(/\s/g,''),has=(...w)=>w.some(x=>s.includes(x)),st=[];
  if(has('검은','검정','까만','어두운','블랙','잉크')&&has('빼','없애','지워','제거'))
    st.push({op:'dark',maxDark:has('진한','아주')?70:110});
  if(has('살색','피부')&&has('빼','없애','지워','제거','덮'))
    st.push({op:has('덮')?'fill':'skin'});
  if(has('구멍','뚫','빵꾸','메꿔','메워','채워'))st.push({op:'hole'});
  if(!st.length&&has('덮','채워','머리색'))st.push({op:'fill'});
  if(!st.length&&has('빼','지워','없애','투명'))st.push({op:'erase'});
  return st;
}
async function aiPlan(t){
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
    headers:{'content-type':'application/json','x-api-key':key.value.trim(),
      'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-5',max_tokens:400,
      system:'너는 픽셀아트 리터치 도구의 지시 해석기다. 사용자는 고칠 영역을 이미 칠해 뒀다. '+
        '가능한 연산: '+JSON.stringify(OPS)+
        ' 한국어 요청을 연산 순서로 바꿔라. JSON만 출력한다. '+
        '{"steps":[{"op":"dark","maxDark":90}],"say":"한 줄 설명"}',
      messages:[{role:'user',content:t}]})});
  if(!r.ok)throw new Error('API '+r.status);
  const j=await r.json(),tx=(j.content||[]).map(c=>c.text||'').join('');
  return JSON.parse(tx.slice(tx.indexOf('{'),tx.lastIndexOf('}')+1));
}
async function send(t){
  if(!itemData){say('먼저 왼쪽에서 아이템을 골라주세요.');return;}
  say(t,true);$('prompt').value='';
  let steps=[],s='';
  if(key.value.trim()){
    try{const r=await aiPlan(t);steps=r.steps||[];s=r.say||'';}
    catch(e){say('AI 연결이 안 돼서 키워드로 해석합니다.');steps=localPlan(t);}
  }else steps=localPlan(t);
  if(!steps.length){say('무슨 뜻인지 모르겠습니다. 아래 버튼을 눌러보셔도 됩니다.');return;}
  let n=0;for(const st of steps) if(OPS[st.op]) n+=apply(st.op,st)||0;
  say((s?s+'\n':'')+'<b>'+steps.map(x=>x.op).join(' → ')+'</b> · '+n+'픽셀 고쳤습니다. (걸음 3프레임 반영)');
}
$('run').onclick=()=>{const t=$('prompt').value.trim();if(t)send(t);};
$('prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('run').click();}};
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>send(b.dataset.q));

$('tSave').onclick=()=>{
  if(!itemData){say('먼저 아이템을 골라주세요.');return;}
  const c=document.createElement('canvas');c.width=W;c.height=H;
  c.getContext('2d').putImageData(itemData,0,0);
  c.toBlob(bl=>{const fn=(curItem?curItem.id:'retouched')+'.png';
    const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=fn;a.click();
    say('<b>'+fn+'</b> 저장했습니다. char/items/ 에 덮어쓰세요.');});
};
