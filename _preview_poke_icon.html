<title>콕 찌르기 아이콘</title>
<style>
 body{background:#0d0f14;color:#cfd6e6;font-family:system-ui,sans-serif;padding:30px}
 .row{display:flex;gap:26px;align-items:center;margin-bottom:26px}
 .cell{text-align:center;font-size:11px;color:#8a93a8}
 .dot{width:34px;height:34px;border-radius:50%;background:none;border:1.5px solid rgba(245,194,75,.55);
      display:flex;align-items:center;justify-content:center;margin:0 auto 7px}
 .big{width:120px;height:120px;border:1px solid #2b3350;display:flex;align-items:center;justify-content:center;margin-bottom:7px}
</style>

<h3>실제 알림에서 보이는 크기 (16px, 34px 원 안)</h3>
<div class="row">
  <div class="cell">
    <div class="dot">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F5C24B" stroke-width="1.9" stroke-linecap="round"><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/><path d="M5.3 5.3 8.5 8.5M15.5 15.5l3.2 3.2M18.7 5.3 15.5 8.5M8.5 15.5l-3.2 3.2"/></svg>
    </div>
    스파크 (지금 안)
  </div>
  <div class="cell">
    <div class="dot">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F5C24B" stroke-width="1.9" stroke-linecap="round"><path d="M12 3v6M12 15v6M3 12h6M15 12h6"/><path d="M6.2 6.2 9.8 9.8M14.2 14.2l3.6 3.6M17.8 6.2 14.2 9.8M9.8 14.2l-3.6 3.6"/></svg>
    </div>
    선 짧게
  </div>
  <div class="cell">
    <div class="dot">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F5C24B" stroke-width="2.1" stroke-linecap="round"><path d="M12 2.5v5.5M12 16v5.5M2.5 12h5.5M16 12h5.5"/><path d="M5.6 5.6 9 9M15 15l3.4 3.4M18.4 5.6 15 9M9 15l-3.4 3.4"/><circle cx="12" cy="12" r="1.6"/></svg>
    </div>
    가운데 점 추가
  </div>
</div>

<h3>크게 (120px)</h3>
<div class="row">
  <div class="cell">
    <div class="big">
      <svg width="90" height="90" viewBox="0 0 24 24" fill="none" stroke="#F5C24B" stroke-width="1.9" stroke-linecap="round"><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/><path d="M5.3 5.3 8.5 8.5M15.5 15.5l3.2 3.2M18.7 5.3 15.5 8.5M8.5 15.5l-3.2 3.2"/></svg>
    </div>
    스파크
  </div>
  <div class="cell">
    <div class="big">
      <svg width="90" height="90" viewBox="0 0 24 24" fill="none" stroke="#F5C24B" stroke-width="1.9" stroke-linecap="round"><path d="M12 3v6M12 15v6M3 12h6M15 12h6"/><path d="M6.2 6.2 9.8 9.8M14.2 14.2l3.6 3.6M17.8 6.2 14.2 9.8M9.8 14.2l-3.6 3.6"/></svg>
    </div>
    선 짧게
  </div>
  <div class="cell">
    <div class="big">
      <svg width="90" height="90" viewBox="0 0 24 24" fill="none" stroke="#F5C24B" stroke-width="2.1" stroke-linecap="round"><path d="M12 2.5v5.5M12 16v5.5M2.5 12h5.5M16 12h5.5"/><path d="M5.6 5.6 9 9M15 15l3.4 3.4M18.4 5.6 15 9M9 15l-3.4 3.4"/><circle cx="12" cy="12" r="1.6"/></svg>
    </div>
    가운데 점
  </div>
</div>
